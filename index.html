<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Shared plans: your Supabase settings go on the next line. The app's Team page shows the exact line to paste. -->
<script>window.BLOCK_BUILDER_SUPABASE={url:"",anonKey:""};</script>
<title>Marathon Block Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style id="app-css">
/* Layout: a training-log desk. Header with race facts, then the mileage profile beside the pace sheet, then the week-by-week calendar. */
:root{
  --paper:#EEF2F5; --surface:#FFFFFF; --sunk:#F5F7F9; --ink:#132030; --muted:#5A6878; --line:#D6DDE4;
  --accent:#C8452B; --accent-ink:#FFFFFF; --accent-soft:#F8E3DD;
  --easy:#2E8B7E; --easy-soft:#E1F1EE; --medium:#C08516; --medium-soft:#F7EDD8;
  --hard:#9C2F45; --hard-soft:#F4E0E4; --taper:#6F7F92; --taper-soft:#E7ECF1; --race:#132030; --race-soft:#DCE3EA;
  --focus:#2F6FD6; --strava:#E34402;
  --a0:#3767D0; --a1:#B0437A; --a2:#2D8A57; --a3:#BD7410; --a4:#6A52C4; --a5:#16818F;
  --go:#1E8A47; --go-soft:#DCF2E3;
  --m1:#2a78d6; --m2:#eb6834; --m3:#1baf7a; --m4:#eda100; --m5:#e87ba4; --m6:#008300; --m7:#6250d6; --m8:#e34948;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F151C; --surface:#17202A; --sunk:#1C2631; --ink:#E5EBF1; --muted:#93A1B0; --line:#2A3644;
  --accent:#EE6A4C; --accent-ink:#1A0E0A; --accent-soft:#3A221D;
  --easy:#5CC2B2; --easy-soft:#173330; --medium:#E3AA45; --medium-soft:#362B16;
  --hard:#E0738A; --hard-soft:#3A1D25; --taper:#9AAABD; --taper-soft:#222D39; --race:#E5EBF1; --race-soft:#2A3644;
  --focus:#7AA7F0; --strava:#FF7A3D;
  --a0:#7EA2F2; --a1:#E58AB7; --a2:#6ACB92; --a3:#EDB25A; --a4:#A994F0; --a5:#5CC7D3;
  --go:#5BD68D; --go-soft:#173A26;
  --m1:#3987e5; --m2:#d95926; --m3:#199e70; --m4:#c98500; --m5:#d55181; --m6:#008300; --m7:#9085e9; --m8:#e66767; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F151C; --surface:#17202A; --sunk:#1C2631; --ink:#E5EBF1; --muted:#93A1B0; --line:#2A3644;
  --accent:#EE6A4C; --accent-ink:#1A0E0A; --accent-soft:#3A221D;
  --easy:#5CC2B2; --easy-soft:#173330; --medium:#E3AA45; --medium-soft:#362B16;
  --hard:#E0738A; --hard-soft:#3A1D25; --taper:#9AAABD; --taper-soft:#222D39; --race:#E5EBF1; --race-soft:#2A3644;
  --focus:#7AA7F0; --strava:#FF7A3D;
  --a0:#7EA2F2; --a1:#E58AB7; --a2:#6ACB92; --a3:#EDB25A; --a4:#A994F0; --a5:#5CC7D3;
  --go:#5BD68D; --go-soft:#173A26;
  --m1:#3987e5; --m2:#d95926; --m3:#199e70; --m4:#c98500; --m5:#d55181; --m6:#008300; --m7:#9085e9; --m8:#e66767; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:0 120px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em;text-transform:uppercase;margin-right:6px;white-space:nowrap}
.brand b{color:var(--accent)}
.top select{min-width:0;max-width:280px;flex:1 1 180px}
.status{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.status.err{color:var(--accent)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
select,input[type=text],input[type=date],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input:hover,select:hover{border-color:var(--muted)}

/* plan header */
.head{padding-block:26px 18px;display:grid;gap:16px}
.eyebrow{font-family:var(--f-display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.title-in{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,5vw,52px);line-height:1;border:0;background:transparent;padding:0;width:100%;letter-spacing:-.005em;border-bottom:2px solid transparent;border-radius:0}
.title-in:hover{border-bottom-color:var(--line)}
.title-in:focus{border-bottom-color:var(--accent);outline:none}
.fields{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input,.field select{width:100%}
.field small{font-size:12px;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.stat{padding:10px 18px;border-right:1px solid var(--line);display:grid;gap:0;flex:1 1 120px}
.stat:last-child{border-right:0}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat .v{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .v small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500;margin-left:3px}

/* cards */
.row2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card h2{font-family:var(--f-display);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.03em;margin:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hint{font-size:13px;color:var(--muted);margin:0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

#chart{width:100%;height:240px;display:block;touch-action:none;user-select:none}
#chart text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
#chart .ml{font-family:var(--f-mono);font-size:10.5px;fill:var(--ink)}
#chart .grid{stroke:var(--line);stroke-width:1}
#chart .col{cursor:pointer;fill:transparent}
#chart .bar{transition:fill .15s}
#chart .handle{fill:var(--ink);opacity:0}
#chart g.wk:hover .handle,#chart g.wk.drag .handle{opacity:.85}
#chart g.wk.now .bar{stroke:var(--ink);stroke-width:1.5}

table.paces{width:100%;border-collapse:collapse;font-size:14px}
.paces th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:right;padding:4px 5px;border-bottom:1px solid var(--line)}
.paces th:first-child,.paces td:first-child{text-align:left}
.paces td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.paces tr:last-child td{border-bottom:0}
.paces td:first-child{font-family:var(--f-body);font-size:14px}
.code{font-family:var(--f-mono);font-size:11.5px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}
.pace-scroll{overflow-x:auto}

details.card summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
details.card summary::-webkit-details-marker{display:none}
details.card summary h2::before{content:"▸ ";color:var(--muted);font-size:16px}
details[open].card summary h2::before{content:"▾ "}
.gl-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px}
.gl-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:6px;padding:6px 10px;font-size:14px}

/* weeks */
.sect-h{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin:30px 0 10px}
.sect-h h2{font-family:var(--f-display);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.03em;margin:0}
.weeks{display:grid;gap:10px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;--tc:var(--easy);--ts:var(--easy-soft)}
.week.t-Medium{--tc:var(--medium);--ts:var(--medium-soft)}
.week.t-Hard{--tc:var(--hard);--ts:var(--hard-soft)}
.week.t-Taper{--tc:var(--taper);--ts:var(--taper-soft)}
.week.t-Race{--tc:var(--race);--ts:var(--race-soft)}
.week.now{box-shadow:0 0 0 2px var(--ink)}
.wk-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:var(--ts);border-bottom:1px solid var(--line)}
.wk-num{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1;color:var(--tc);min-width:58px}
.wk-dates{font-size:14px;font-weight:600}
.wk-head .sp{flex:1}
.wk-head select{padding:4px 6px;font-size:13px;font-weight:600;border-color:transparent;background:var(--surface)}
.wk-miles{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted)}
.wk-miles input{width:64px;padding:4px 6px;text-align:right;font-family:var(--f-mono);font-size:13px}
.togo{font-size:12px;color:var(--muted);white-space:nowrap}
.badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--ink);color:var(--paper);border-radius:4px;padding:2px 6px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.day{border-right:1px solid var(--line);padding:8px 10px 10px;min-height:86px;cursor:text;position:relative;min-width:0}
.day:last-child{border-right:0}
.day:hover{background:var(--sunk)}
.day.ro{cursor:default}
.day.drop{background:var(--accent-soft)}
.dl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between}
.dt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;margin-top:3px}
.k-empty .dt{color:var(--muted)}
.k-easy .dt,.k-rest .dt{color:var(--muted)}
.k-work .dt{font-weight:500}
.k-work{box-shadow:inset 3px 0 0 var(--tc)}
.k-race{background:var(--race-soft)}
.k-race .dt{font-family:var(--f-display);font-weight:700;font-size:18px;text-transform:uppercase}
.pz{font-family:var(--f-mono);font-size:12.5px;background:var(--ts);color:var(--ink);border-radius:3px;padding:0 3px;white-space:nowrap}
.day textarea{width:100%;min-height:70px;resize:vertical;margin-top:3px;font-size:14px;line-height:1.4;padding:5px 6px;border-color:var(--focus)}

/* sections */
.tabs{display:inline-flex;gap:2px;background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:2px}
.tabs button{border:0;background:transparent;padding:5px 14px;border-radius:5px;font-weight:600;cursor:pointer;color:var(--muted);font-size:14px}
.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.tabs .dot{color:var(--accent)}

/* team */
.page-h{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;padding-block:26px 14px}
.page-h h1{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,5vw,48px);line-height:1;margin:0}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;align-content:start}
.aname{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.1}
.adot{width:11px;height:11px;border-radius:50%;background:var(--ac);flex:none}
.ameta{font-size:13px;color:var(--muted)}
.ameta b{color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.cc{font-size:12px;border-radius:999px;padding:1px 9px;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.cc.sev-sore{border-color:var(--medium);color:var(--medium)}
.cc.sev-painful{border-color:var(--hard);color:var(--hard);font-weight:600}
.tpill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:4px;padding:1px 6px;background:var(--ts);color:var(--tc)}
.t-Easy{--tc:var(--easy);--ts:var(--easy-soft)} .t-Medium{--tc:var(--medium);--ts:var(--medium-soft)} .t-Hard{--tc:var(--hard);--ts:var(--hard-soft)} .t-Taper{--tc:var(--taper);--ts:var(--taper-soft)} .t-Race{--tc:var(--race);--ts:var(--race-soft)}
.acard .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.wknav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wknav .lbl{font-family:var(--f-display);font-weight:700;font-size:20px;min-width:170px;text-align:center}
.ovl{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:6px}
.ovl li{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:14px}
.ovl .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-right:8px}
.ovl .who{color:var(--muted)}
.tw-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tw{border-collapse:collapse;width:100%;min-width:940px;table-layout:fixed}
.tw th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);font-weight:600;vertical-align:bottom}
.tw th .cnt{display:block;text-transform:none;letter-spacing:0;font-weight:600;color:var(--accent);font-size:12px}
.tw th:first-child{width:180px}
.tw th.today{background:var(--accent-soft)}
.tw td{vertical-align:top;padding:8px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);font-size:13px;cursor:pointer;min-width:0}
.tw tr:last-child td{border-bottom:0}
.tw td:hover{background:var(--sunk)}
.tw td.ath{cursor:default;border-left:0;background:var(--surface)}
.tw td.ath .aname{font-size:18px}
.tw td.ath .aname button{all:unset;cursor:pointer}
.tw td.ath .aname button:hover{text-decoration:underline}
.tw td.ath .aname button:focus-visible{outline:2px solid var(--focus)}
.tw td .dt{white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.tw td.k-work .dt{font-weight:500}
.tw td.k-easy .dt,.tw td.k-rest .dt,.tw td.k-empty .dt{color:var(--muted)}
.tw td.k-race .dt{font-family:var(--f-display);font-weight:700;font-size:16px;text-transform:uppercase}
.tw td.none{background:var(--sunk);cursor:default;color:var(--muted);font-size:12px}
.tw td.shared{box-shadow:inset 0 0 0 2px var(--accent)}
.tw td.together,.tw td.together:hover{background:var(--go-soft);box-shadow:inset 0 0 0 2px var(--go)}
.ovl .tag.go{color:var(--go)}
.tg{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.02em;color:var(--go);background:var(--go-soft);border:1px solid var(--go);border-radius:3px;padding:0 5px;margin-top:5px;margin-right:4px;vertical-align:middle}
.day.with{box-shadow:inset 0 -3px 0 var(--go)}
.legend2{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend2 i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:5px}
.sch{font-size:12px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.sch b{color:var(--ink);font-weight:600}
.pt{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--easy);border:1px solid currentColor;border-radius:3px;padding:0 4px;margin-top:5px;margin-right:4px;vertical-align:middle}

/* training mix */
.mix-bar{display:flex;gap:2px;height:22px;background:var(--surface);margin-top:10px}
.mix-bar span{min-width:2px}
.mix-bar span:first-child{border-radius:4px 0 0 4px}
.mix-bar span:last-child{border-radius:0 4px 4px 0}
.mix-leg{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 16px}
.mix-leg li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px}
.mix-leg i{width:12px;height:12px;border-radius:3px}
.mix-leg b{font-family:var(--f-mono);font-size:13px;font-weight:500}
.mix-leg small{display:block;color:var(--muted);font-size:12px}
.mix-leg li.zero{opacity:.45}
.mix-sum{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--muted)}
.mix-sum b{color:var(--ink);font-weight:600}
.mix-weeks{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(14px,1fr);gap:4px;align-items:end;height:120px;margin-top:14px;padding-bottom:2px;border-bottom:1px solid var(--line)}
.mix-col{display:flex;flex-direction:column-reverse;gap:2px;height:100%;justify-content:flex-start;cursor:default}
.mix-col span{display:block;min-height:2px}
.mix-col span:last-child{border-radius:4px 4px 0 0}
.mix-col:hover span{filter:brightness(1.08)}
.mix-wl{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(14px,1fr);gap:4px;font-size:10.5px;color:var(--muted);text-align:center;margin-top:4px}
.vtip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12.5px;line-height:1.4;padding:7px 10px;border-radius:6px;max-width:260px;white-space:pre-line}

/* workout library */
.lib{position:fixed;right:0;bottom:0;width:340px;z-index:24;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.08)}
.lib-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px 8px}
.lib-h h2{font-family:var(--f-display);font-weight:700;font-size:21px;text-transform:uppercase;margin:0}
.lib-q{margin:0 14px 8px;width:calc(100% - 28px)}
.lib-cats{display:flex;gap:4px;flex-wrap:wrap;padding:0 14px 10px;border-bottom:1px solid var(--line)}
.lib-cats button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.lib-cats button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.lib-list{list-style:none;margin:0;padding:10px 14px 14px;overflow-y:auto;flex:1;display:grid;gap:8px;align-content:start}

const toD=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d))};
const iso=d=>d.toISOString().slice(0,10);
const addDays=(d,n)=>new Date(d.getTime()+n*DAY_MS);
const dow=d=>(d.getUTCDay()+6)%7; // Mon=0
const mondayOf=d=>addDays(d,-dow(d));
const fmtD=d=>`${MON[d.getUTCMonth()]} ${d.getUTCDate()}`;
const fmtLong=d=>`${DAYS[dow(d)]}, ${MON[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}`;
const todayD=()=>{const n=new Date();return new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))};
const uid=()=>"p_"+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- paces ---------- */
function parseTime(s,dist){
  const p=String(s||"").trim().split(":").map(Number);
  if(!p.length||p.some(isNaN))return null;
  if(p.length===3)return p[0]*3600+p[1]*60+p[2];
  if(p.length===2)return dist>=13?p[0]*3600+p[1]*60:p[0]*60+p[1];
  return null;
}
function fmtSec(s,forceMin){
  s=Math.round(s);
  if(s<60&&!forceMin)return s+"s";
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return h?`${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`:`${m}:${String(x).padStart(2,"0")}`;
}
const ZONES=[
  {k:"E",name:"Easy",d:null},
  {k:"MP",name:"Marathon",d:26.2188},
  {k:"HMP",name:"Half marathon",d:13.1094},
  {k:"T",name:"Threshold (15K)",d:9.3206},
  {k:"10K",name:"10K",d:6.2137},
  {k:"5K",name:"5K",d:3.1069},
  {k:"MILE",name:"Mile",d:1},
];
// Riegel: T2 = T1 * (d2/d1)^1.06. Returns seconds per mile for each zone.
function paces(plan){
  const dist=+plan.dist||26.2188, T=parseTime(plan.goal,dist);
  if(!T)return null;
  const per=d=>T*Math.pow(d/dist,1.06)/d;
  const out={};
  for(const z of ZONES){
    if(z.k==="E"){const mp=per(26.2188);out.E=[mp*1.2,mp*1.3];}
    else out[z.k]=per(z.d);
  }
  out.GOAL=T;
  return out;
}
function splitMeters(n,u){n=parseFloat(n);u=(u||"m").toLowerCase();return u==="mi"?n*1609.344:(u==="k"||u==="km")?n*1000:n}
const TOKEN=/\{(E|MP|HMP|T|10K|5K|MILE|GOAL)(?:\/([\d.]+)\s*(k|km|mi|m)?)?\}/gi;
function resolveText(text,P){
  // escapes text, then swaps pace codes for highlighted paces
  const s=esc(text);
  if(!P)return s;
  return s.replace(TOKEN,(all,z,n,u)=>{
    z=z.toUpperCase();
    if(z==="GOAL")return `<span class="pz">${fmtSec(P.GOAL)}</span>`;
    let v=P[z];
    if(n){
      const m=splitMeters(n,u),f=x=>fmtSec(x*m/1609.344);
      return `<span class="pz" title="${z} pace">${Array.isArray(v)?f(v[0])+"–"+f(v[1]):f(v)}</span>`;
    }
    return `<span class="pz" title="${z} pace">${Array.isArray(v)?fmtSec(v[0],1)+"–"+fmtSec(v[1],1):fmtSec(v,1)}/mi</span>`;
  });
}
const plainText=(text,P)=>{const d=document.createElement("div");d.innerHTML=resolveText(text,P);return d.textContent};

/* ---------- guideline (distilled from the 2026 Chicago block) ---------- */
// 13 quality weeks, oldest first: [midweek session, long run].
// Workouts from the 2026 Chicago workbook, tagged with that week's Easy/Medium/Hard label.
// wk = workbook week (1-19, race in wk 19). Paces are rewritten as pace codes so they scale to any goal.
const LIB=[
  {wk:3,type:"Medium",mid:null,lr:"Easy long run"},
  {wk:4,type:"Easy",mid:"10 x 400 @ {5K/400}, 60s rest",lr:"12mi, last 3mi @ {T}"},
  {wk:5,type:"Hard",mid:"4 x 1mi @ {MP}, 90s rest",lr:"3mi WU\n3 x 2mi @ {MP}\n3mi CD"},
  {wk:6,type:"Medium",mid:"4 x 800 @ {5K/800}, 2min rest\n5min rest\n8 x 200 hill, 60s rest",lr:"16mi with 6mi @ {T}"},
  {wk:7,type:"Easy",mid:"5 x 1k @ {HMP/1k}, 90s rest",lr:"3mi WU\n3 x 3mi @ {T}, 1mi rest\n2mi CD"},
  {wk:8,type:"Hard",mid:"2 x 1mi @ {HMP}\n4 x 400 @ {5K/400}\n2 x 1mi @ {HMP}\nall 90s rest",lr:"3mi WU\n2 x 4mi @ {MP}–{HMP}, 1mi rest\n3mi CD"},
  {wk:9,type:"Medium",mid:"10 x 800 @ {10K/800}, 2min rest",lr:"4mi WU\n8mi @ {T}\n4mi CD"},
  {wk:10,type:"Easy",mid:"Easy with 6 x 1min on/off",lr:"Easy 16mi"},
  {wk:11,type:"Hard",mid:"2 x 5 x 300 @ {5K/300}\n6 x 200 @ {MILE/200}\nrep rest 90s, set rest 5min",lr:"16mi with 8mi progression from {MP} down to {HMP}"},
  {wk:12,type:"Medium",mid:"6 x 1mi @ {HMP}, 2min rest",lr:"16mi with 2 x 4mi @ {MP}–{HMP}, 5min rest"},
  {wk:13,type:"Easy",mid:"8 x 1k @ {HMP/1k}, 90s rest",lr:"16mi with 6 x 4min @ {HMP}, 1min rest"},
  {wk:14,type:"Medium",mid:"6 x (1mi @ {HMP/1mi} + 800 @ {5K/800})\n60s rep rest, 2min set rest",lr:"20mi easy"},
  {wk:15,type:"Hard",mid:"2mi @ {T}\n3min rest\n4 x 400 @ {5K/400}, 60s rest\n3min rest\n2mi @ {T}",lr:"4mi WU\n8 x 1mi @ {MP}–{HMP}, 2min rest\n4mi CD"},
  {wk:16,type:"Easy",taper:true,mid:"4-3-2-1 min hard / equal easy float",lr:"20mi with 14mi @ {MP}\n3mi WU, 3mi CD"},
  {wk:17,type:"Medium",taper:true,mid:"8 x 1k @ {HMP/1k}, 90s rest\n2 x 4 x 200 @ {MILE/200}, 90s rep rest, 3min set rest",lr:"2mi WU\n2 x 6mi @ {MP}, 5min rest\n2mi CD"},
  {wk:18,type:"Medium",taper:true,mid:"6 x 1k @ {HMP/1k}, 90s rest",lr:"10mi with 5mi @ {MP}"},
];
// Pick the workbook week of this type at the most similar point in the block; avoid reusing one already in the plan.
function pickEntry(type,phase,used){
  const pool=type==="Taper"?LIB.filter(e=>e.taper):LIB.filter(e=>e.type===type);
  let best=null,bs=Infinity;
  for(const e of pool){const sc=Math.abs((e.wk-1)/18-phase)+(used&&used.has(e.wk)?.2:0);if(sc<bs){bs=sc;best=e}}
  return best;
}
function workoutsFor(plan,wi,type,used){
  if(type==="Race")return{days:raceWeekDays(plan),src:null};
  const s=plan.settings,n=plan.weeks.length,e=pickEntry(type,n>1?wi/(n-1):1,used),d=baseDays(s,type);
  if(e){if(e.mid)d[s.qualityDay]=e.mid;d[s.longDay]=e.lr;if(used)used.add(e.wk)}
  else d[s.longDay]="Easy long run";
  return{days:d,src:e?e.wk:null};
}
const TAPER_PCT=[.85,.72,.64],RACE_PCT=.58;

function weekCount(plan){
  const a=mondayOf(toD(plan.start)),b=mondayOf(toD(plan.raceDate));
  return Math.max(1,Math.round((b-a)/DAY_MS/7)+1);
}
function blankWeek(){return{type:"Easy",miles:null,days:Array(7).fill("")}}
function baseDays(s,type){
  const d=Array(7).fill("Easy");
  if(type==="Medium")return d; // workbook Medium weeks have no strides day
  d[3]="Easy + strides";
  if(s.longDay===3||s.qualityDay===3)d[4]="Easy + strides";
  return d;
}
function raceWeekDays(plan){
  const r=dow(toD(plan.raceDate)),d=Array(7).fill("Easy");
  for(let i=0;i<7;i++){
    if(i>r)d[i]="Rest";
    else if(i===r)d[i]="RACE DAY\nGoal {GOAL} · {MP}";
    else if(i===r-1)d[i]="Shakeout 3mi + strides\nTypical pre-race";
    else if(i===r-4)d[i]="Easy + strides";
  }
  if(r>=6)d[0]="Rest";
  return d;
}
function generate(plan,{miles=true,workouts=true}={}){
  const s=plan.settings, n=weekCount(plan);
  const taperN=Math.min(3,Math.max(0,n-2)), buildN=n-1-taperN;
  const weeks=[];
  for(let i=0;i<n;i++)weeks.push(plan.weeks[i]?clone(plan.weeks[i]):blankWeek());
  // mileage: 3-week blocks (Easy, Hard, Medium) rising toward peak; taper as % of peak
  if(miles){
    const peak=+s.peakMiles||80, step=+s.step||0, start=+s.startMiles||Math.round(peak*.6);
    const nBlocks=Math.ceil(buildN/3), top=peak-2*step;
    const inc=nBlocks>1?(top-start)/(nBlocks-1):0;
    for(let i=0;i<buildN;i++){
      const j=buildN-1-i, bfe=Math.floor(j/3), within=2-(j%3);
      weeks[i].miles=Math.max(0,Math.round(top-bfe*inc+within*step));
      weeks[i].type=["Easy","Hard","Medium"][within];
    }
    for(let t=0;t<taperN;t++){const w=weeks[buildN+t];w.miles=Math.round(peak*TAPER_PCT[t]);w.type="Taper"}
    weeks[n-1].miles=Math.round(peak*RACE_PCT);weeks[n-1].type="Race";
  }
  if(workouts){
    plan.weeks=weeks;
    const used=new Set();
    weeks.forEach((w,i)=>{const r=workoutsFor(plan,i,w.type,used);w.days=r.days;w.src=r.src});
  }
  plan.weeks=weeks;
  return plan;
}
// Keep weeks aligned to race day when dates move: add/drop weeks at the start.
function resize(plan){
  const n=weekCount(plan),cur=plan.weeks.length;
  if(n>cur){
    const first=plan.weeks[0]||blankWeek(),add=[];
    for(let i=0;i<n-cur;i++){const w=blankWeek();w.miles=first.miles;w.days=baseDays(plan.settings);w.days[plan.settings.longDay]="Easy long run";add.push(w)}
    plan.weeks=add.concat(plan.weeks);
    return `Added ${n-cur} base week${n-cur>1?"s":""} at the start`;
  }
  if(n<cur){plan.weeks=plan.weeks.slice(cur-n);return `Removed ${cur-n} week${cur-n>1?"s":""} from the start`}
  return "";
}
function newPlan(o={}){
  const race=o.raceDate||iso(addDays(todayD(),7*18));
  const p={name:o.name||"New marathon block",athleteId:o.athleteId||null,athlete:o.athlete||"",race:o.race||"",dist:+o.dist||26.2188,
    start:o.start||iso(addDays(mondayOf(toD(race)),-7*17)),raceDate:race,goal:o.goal||"2:45:00",
    settings:Object.assign({startMiles:50,peakMiles:80,step:6,qualityDay:2,longDay:5},o.settings||{}),weeks:[],updatedAt:Date.now()};
  return generate(p);
}

const fmtStamp=ms=>{const d=new Date(ms);return `${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`};
function stripId(p){const o=clone(p);delete o.id;return o}

async function initStore(){
  renderTop();
  let db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){db=null}
  if(db){
    S.mode="db";S.db=db;S.col=db.collection("plans");
    db.collection("athletes").onSnapshot(snap=>{
      const next={};snap.docs.forEach(d=>{const x=d.data();if(x)next[d.id]=Object.assign(x,{id:d.id})});
      for(const id in S.athletes)if(S.athPending&&S.athPending.has(id))next[id]=S.athletes[id];
      S.athletes=next;S.athLoaded=true;
      afterLoad(false);
      if(S.page!=="plan"&&!typingInApp())render();
    },err=>status("Couldn't reach the athlete list: "+(err&&err.message||"try reloading"),true));
    S.col.onSnapshot(snap=>{S.plansLoaded=true;
      const seen=new Set();let curChanged=false;
      snap.docs.forEach(doc=>{
        seen.add(doc.id);
        if(S.dirty.has(doc.id))return;
        const data=doc.data();if(!data)return;
        const have=S.plans[doc.id];
        if(!have||have.updatedAt!==data.updatedAt){S.plans[doc.id]=Object.assign(data,{id:doc.id});if(doc.id===S.cur)curChanged=true}
      });
      for(const id of Object.keys(S.plans))if(!seen.has(id)&&!S.dirty.has(id)){delete S.plans[id];if(id===S.cur)curChanged=true}
      if(S.mode==="db"&&!S.dirty.size&&!S.statusErr&&!S.unsaved)status(savedMsg());
      afterLoad(curChanged);
    },err=>status("Couldn't reach the plan library: "+(err&&err.message||"try reloading"),true));
    renderTop();
    // editors get the button that refreshes the public read-only copy
    try{const u=window.claude.use?await window.claude.use("user"):null;S.canPublish=u?await u.canEdit():true}catch(e){S.canPublish=true}
    renderTop();if(P())render();
  }else if(!STANDALONE&&SNAP&&SNAP.plans&&Object.keys(SNAP.plans).length){
    S.mode="snapshot";
    for(const id in SNAP.plans)S.plans[id]=Object.assign(clone(SNAP.plans[id]),{id});
    for(const id in (SNAP.athletes||{}))S.athletes[id]=Object.assign(clone(SNAP.athletes[id]),{id});
    status("Updated "+fmtStamp(SNAP.updatedAt));
    renderTop();afterLoad(true);
  }else if(SB_CFG){
    await initCloud();
  }else{
    S.mode="local";
    try{const raw=JSON.parse(lsGet(LS)||"{}");for(const id in raw)S.plans[id]=Object.assign(raw[id],{id})}catch(e){}
    try{const raw=JSON.parse(lsGet(LSA)||"{}");for(const id in raw)S.athletes[id]=Object.assign(raw[id],{id})}catch(e){}
    // first visit to the standalone site: start from the plans bundled with the page
    if(STANDALONE&&!Object.keys(S.plans).length&&SNAP&&SNAP.plans&&lsGet("blockbuilder.seeded")===null){
      for(const id in SNAP.plans)S.plans[id]=Object.assign(clone(SNAP.plans[id]),{id});
      saveLocal();lsSet("blockbuilder.seeded","1");
    }
    status("Plans save in this browser");
    renderTop();afterLoad(true);
  }
}
async function publishSnapshot(btn){
  btn.disabled=true;btn.textContent="Updating…";
  if(S.editing)commitEditor();
  for(const id of Object.keys(S.timers))if(S.timers[id]){clearTimeout(S.timers[id]);S.timers[id]=null;await flush(id)}
  const fail=msg=>{btn.disabled=false;btn.textContent="Update public copy";const n=$("#pub-note");if(n)n.textContent=msg};
  let art=null;try{art=window.claude&&window.claude.use?await window.claude.use("artifact"):null}catch(e){}
  if(!art)return fail("Updating the public copy isn't available in this view. Open the page on claude.ai while signed in.");
  const plans={},athletes={};for(const id in S.plans)plans[id]=stripId(S.plans[id]);for(const id in S.athletes)athletes[id]=stripId(S.athletes[id]);
  try{
    await art.publish(buildPage({updatedAt:Date.now(),plans,athletes}));
    toast("Public copy updated. Reloading…");
  }catch(e){
    const c=e&&e.code;
    if(c==="conflict")return fail("The page was just updated somewhere else and is reloading. Try again once it reloads.");
    if(c==="not_writer"||c==="not_granted"){S.canPublish=false;return fail("Only people who can edit this page can update the public copy.")}
    if(c==="rate_limited")return fail("Updated too often. Wait a minute and try again.");
    fail("Couldn't update the public copy: "+(e&&e.message||"try again"));
  }
}

    <div class="btns"><button class="btn primary" data-act="publish-snap">Update public copy</button></div></div>`;

function setCurrent(id){
  S.cur=id&&S.plans[id]?id:null;S.unsaved=false;S.dayIdx=null;
  if(S.cur)lsSet("blockbuilder.cur",S.cur);
  S.draft=S.cur?clone(S.plans[S.cur]):null;
  if(S.cur&&!RO()){
    try{const d=JSON.parse(lsGet("blockbuilder.draft")||"null");
      if(d&&d.id===S.cur&&(d.base===S.plans[S.cur].updatedAt||d.base===null)){S.draft=Object.assign(d.plan,{id:S.cur});S.unsaved=true}}catch(e){}
  }
  renderTop();if(S.unsaved)updateSaveUI();
}
// Run next() now, or after the person saves or discards unsaved changes.
function guardUnsaved(next){
  if(!S.unsaved||RO())return next();
  S.guardNext=next;
  modal(`<h3>Unsaved changes</h3><p>“${esc(S.draft.name)}” has changes you haven't saved.</p>
    <div class="acts"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="guard-discard">Discard changes</button><button class="btn primary" data-act="guard-save">Save and continue</button></div>`);
}
async function flush(id){
  if(S.writing[id]){S.again[id]=true;return}
  const p=S.plans[id];if(!p){S.dirty.delete(id);return}
  S.writing[id]=true;
  try{
    if(S.mode==="db")await S.col.doc(id).set(stripId(p));
    else if(S.mode==="cloud"){const {error}=await S.sb.from("plans").upsert({id,data:stripId(p),updated_at:new Date().toISOString()});if(error)throw error}
    else saveLocal();
    if(!S.unsaved)status(savedMsg());
  }catch(e){
    if(S.mode==="cloud")await cloudWriteFailed(e,id);
    else status(e&&e.code==="not_granted"?"View only: you can't save changes to this library":"Not saved: "+(e&&e.message||"try again"),true);
  }
  S.writing[id]=false;
  if(S.again[id]){S.again[id]=false;return flush(id)}
  if(!S.timers[id])S.dirty.delete(id);
}
async function removePlan(id){
  delete S.plans[id];if(id===S.cur){S.unsaved=false;clearDraft()}S.dirty.delete(id);clearTimeout(S.timers[id]);
  try{
    if(S.mode==="db")await S.col.doc(id).delete();
    else if(S.mode==="cloud"){const {error}=await S.sb.from("plans").delete().eq("id",id);if(error)throw error}
    else saveLocal();
    status("Plan deleted")}
  catch(e){status("Couldn't delete: "+(e&&e.message||"try again"),true)}
}
function addPlan(p){
  p.id=p.id||uid();p.updatedAt=Date.now();
  S.plans[p.id]=clone(p);
  ensureAthletes();
  S.dirty.add(p.id);flush(p.id);
  setCurrent(p.id);S.page="plan";lsSet("blockbuilder.page","plan");render();
}
function afterLoad(curChanged){
  if(S.mode!=="db"||(S.athLoaded&&S.plansLoaded))ensureAthletes();
  const ids=Object.keys(S.plans);
  if(!S.cur||!S.plans[S.cur]){
    const want=lsGet("blockbuilder.cur");
    setCurrent(want&&S.plans[want]?want:ids.sort((a,b)=>(S.plans[b].updatedAt||0)-(S.plans[a].updatedAt||0))[0]||null);
    curChanged=true;
  }else if(curChanged&&!S.unsaved)S.draft=clone(S.plans[S.cur]);
  renderSelect();
  if(curChanged){if(S.editing)S.remotePending=true;else render()}
}
const P=()=>S.draft;

  const nm=id=>id===S.cur&&S.draft?S.draft:S.plans[id];
  if(athleteMode())for(let i=ids.length-1;i>=0;i--)if(nm(ids[i]).athleteId!==S.athLink.id)ids.splice(i,1);
  const opt=id=>`<option value="${id}"${id===S.cur?" selected":""}>${esc(nm(id).name||"Untitled plan")} · ${esc(nm(id).raceDate||"")}${id===S.cur&&S.unsaved?" (unsaved)":""}</option>`;
  const groups={};ids.forEach(id=>{const g=athleteName(nm(id))||"No athlete";(groups[g]=groups[g]||[]).push(id)});
  sel.innerHTML=ids.length?Object.keys(groups).sort().map(g=>`<optgroup label="${esc(g)}">${groups[g].map(opt).join("")}</optgroup>`).join(""):`<option>No plans yet</option>`;
  sel.disabled=!ids.length;
}
function stats(p,Pc){
  const ms=p.weeks.map(w=>+w.miles||0),tot=ms.reduce((a,b)=>a+b,0),peak=Math.max(0,...ms);
  const t=todayD(),r=toD(p.raceDate),days=Math.round((r-t)/DAY_MS);
  const togo=days>0?`${days}<small>days to go</small>`:days===0?`Today`:`Done<small>${fmtD(r)}</small>`;
  return `<div class="stats">
    <div class="stat"><span class="k">Race day</span><span class="v">${fmtD(r)}<small>${DAYS[dow(r)]}</small></span></div>
    <div class="stat"><span class="k">Countdown</span><span class="v">${togo}</span></div>
    <div class="stat"><span class="k">Goal pace</span><span class="v">${Pc?fmtSec(Pc.MP,1):"—"}<small>/mi</small></span></div>
    <div class="stat"><span class="k">Length</span><span class="v">${p.weeks.length}<small>weeks</small></span></div>
    <div class="stat"><span class="k">Peak week</span><span class="v">${peak||"—"}<small>mi</small></span></div>
    <div class="stat"><span class="k">Block total</span><span class="v">${tot.toLocaleString()}<small>mi</small></span></div>
  </div>`;
}
function paceTable(Pc){
  if(!Pc)return `<p class="hint">Enter a goal time like 2:45:00 to see training paces.</p>`;
  const f=(v,m)=>Array.isArray(v)?`${fmtSec(v[0]*m/1609.344,!0)}–${fmtSec(v[1]*m/1609.344,!0)}`:fmtSec(v*m/1609.344);
  const rows=ZONES.map(z=>{
    const v=Pc[z.k];
    return `<tr><td>${z.name} <span class="code">{${z.k}}</span></td><td>${Array.isArray(v)?`${fmtSec(v[0],1)}–${fmtSec(v[1],1)}`:fmtSec(v,1)}</td><td>${f(v,1000)}</td>${z.k==="E"?"<td>—</td><td>—</td>":`<td>${f(v,400)}</td><td>${f(v,800)}</td>`}</tr>`;
  }).join("");
  return `<div class="pace-scroll"><table class="paces num"><thead><tr><th>Zone · code</th><th>/mi</th><th>/km</th><th>400</th><th>800</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="hint" style="margin-top:10px">Type a code in any workout and it shows the pace for the current goal time. Add a distance for splits: <span class="code">{5K/400}</span> <span class="code">{HMP/1k}</span> <span class="code">{MP/1mi}</span>. Change the goal and every workout updates.</p>`;
}
// Accept a Strava activity URL (or a bare activity id); null means it isn't one.
function stravaUrl(v){
  v=String(v||"").trim();if(!v)return"";
  if(/^\d{5,}$/.test(v))return"https://www.strava.com/activities/"+v;
  if(!/^https?:\/\//i.test(v))v="https://"+v;
  try{const u=new URL(v);if(/(^|\.)strava\.com$/i.test(u.hostname)||/^strava\.app\.link$/i.test(u.hostname)){u.protocol="https:";return u.href}}catch(e){}
  return null;
}
const linkOf=(w,di)=>(w.links&&w.links[di])||"";
function kind(t){
  const s=(t||"").trim().toLowerCase();
  if(!s)return"empty";
  if(/race day/.test(s))return"race";
  if(/^(rest|off)\b/.test(s))return"rest";
  if(/^easy/.test(s)&&!/\d\s*x|@|tempo|\{|progression|escalation/.test(s))return"easy";
  return"work";
}
// v: "w" week row, "m" month grid, "d" single-day view
function dayCell(p,wi,di,Pc,v="w"){

  const lbl=v==="m"?`<span class="num">${d.getUTCDate()}</span>${isToday?'<span class="tdy">Today</span>':""}`
    :v==="d"?`<span>${DAYS_LONG[di]}</span>${isToday?'<span class="tdy">Today</span>':""}`
    :`<span>${DAYS[di]}</span><span class="num">${d.getUTCDate()}</span>`;
  const am=athleteMode(),partners=partnersOn(p,wi,di);
  return `<div class="day k-${k}${RO()&&!am?" ro":""}${isToday?" today":""}${partners.length?" with":""}" data-w="${wi}" data-d="${di}" data-v="${v}"${RO()?(am?' tabindex="0"':""):(v==="d"?"":' draggable="true"')+' tabindex="0"'} aria-label="${DAYS_LONG[di]} ${fmtD(d)}: ${esc(t?plainText(t,Pc):"empty")}${am?". Press Enter to request a change.":RO()?"":". Press Enter to edit."}">
    <div class="dl">${lbl}</div>
    <div class="dt">${t?resolveText(t,Pc):"—"}</div>${schedHTML(schedOf(w,di))}${ptDaysFor(p,wi).includes(di)?`<span class="pt" title="${esc(ptTitle(p))}">${v==="m"?"PT":esc(ptTitle(p).replace("PT: ","PT · "))}</span>`:""}${partners.length?`<span class="tg" title="${esc(partners.map(x=>`${x.a.name} at ${fmtTime(x.t)}${x.loc?", "+x.loc:""}`).join("; "))}">With ${esc(partners.map(x=>x.a.name.split(" ")[0]).join(", "))}</span>`:""}${requestOn(p.id,wi,di)?`<span class="rqtag" title="Open change request">Request</span>`:""}${linkOf(w,di)?`<a class="sv" href="${esc(linkOf(w,di))}" target="_blank" rel="noopener" title="Open this run on Strava">${v==="m"?"Strava ↗":"View on Strava ↗"}</a>`:""}</div>`;
}
const typeSelect=(wi,w)=>`<select data-wf="type" data-w="${wi}"${RO()?" disabled":""} aria-label="Week ${wi+1} type" title="Changing the type swaps in workbook workouts of that type">${TYPES.map(t=>`<option${t===w.type?" selected":""}>${t}</option>`).join("")}</select>`;
function weekHTML(p,wi,Pc,nowIdx){

    </div>

const MONTHS_LONG=["January","February","March","April","May","June","July","August","September","October","November","December"];
function monthHTML(p,Pc){
  const start=mondayOf(toD(p.start)),end=addDays(start,p.weeks.length*7-1);
  let out="",m=new Date(Date.UTC(start.getUTCFullYear(),start.getUTCMonth(),1));
  while(m<=end){
    const y=m.getUTCFullYear(),mo=m.getUTCMonth(),last=new Date(Date.UTC(y,mo+1,0));
    let rows="";
    for(let wk=mondayOf(m<start?start:m);wk<=(last>end?end:last);wk=addDays(wk,7)){
      const wi=Math.round((wk-start)/DAY_MS/7),w=p.weeks[wi];
      let cells="";
      for(let di=0;di<7;di++){
        const d=addDays(wk,di);
        cells+=d.getUTCMonth()===mo?dayCell(p,wi,di,Pc,"m"):`<div class="day out" aria-hidden="true"><div class="dl"><span class="num">${d.getUTCDate()}</span></div></div>`;
      }
      rows+=`<div class="mrow t-${esc(w.type||"Easy")}" data-wk="${wi}">${cells}<div class="mwk"><b>W${wi+1}</b>${typeSelect(wi,w)}<span class="mi">${w.miles??"—"} mi</span></div></div>`;
    }
    out+=`<section class="month"><h3>${MONTHS_LONG[mo]} ${y}</h3><div class="mgrid"><div class="mhead">${DAYS.map(d=>`<span>${d}</span>`).join("")}<span>Week</span></div>${rows}</div></section>`;
    m=new Date(Date.UTC(y,mo+1,1));
  }
  return `<div class="months">${out}</div>`;
}
function dayIndexDefault(p){const i=Math.round((todayD()-mondayOf(toD(p.start)))/DAY_MS);return i>=0&&i<p.weeks.length*7?i:0}
function dayHTML(p,Pc){

        <div class="hint">Week ${wi+1} of ${p.weeks.length} · ${toRace>0?toRace+" day"+(toRace>1?"s":"")+" to race day":toRace===0?"Race day":"After race day"}</div></div>
      <button class="btn" data-act="day-next"${i>=total-1?" disabled":""}>Next ›</button></div>
    <div class="dtools"><button class="btn ghost" data-act="day-today">Today</button><input type="date" id="day-pick" aria-label="Go to date" value="${iso(date)}" min="${iso(start)}" max="${iso(addDays(start,total-1))}"></div>
    <article class="week dayview t-${esc(w.type||"Easy")}" data-wk="${wi}">
      <div class="wk-head"><span class="wk-num num">W${wi+1}</span><span class="wk-dates">${fmtD(addDays(start,wi*7))} – ${fmtD(addDays(start,wi*7+6))}</span><span class="sp"></span>${typeSelect(wi,w)}
        <label class="wk-miles"><input type="number" min="0" max="250" step="1" inputmode="numeric" data-wf="miles" data-w="${wi}" id="mi-${wi}"${RO()?" disabled":""} value="${w.miles??""}" placeholder="—"> mi</label></div>
      <div class="days">${dayCell(p,wi,di,Pc,"d")}</div>
    </article>
    <div class="strip">${chips}</div>
    ${ptDayBox(p,wi,di)}`;
}

/* ---------- mileage chart ---------- */
const CH={pl:34,pr:8,pt:18,pb:36};
let chartMax=100;
function drawChart(){
  const svg=$("#chart"),p=P();if(!svg||!p)return;
  const W=svg.clientWidth||700,H=240,n=p.weeks.length;
  const ms=p.weeks.map(w=>+w.miles||0);
  if(!CH.dragging)chartMax=Math.max(40,Math.ceil(Math.max(...ms)*1.15/20)*20);
  const iw=W-CH.pl-CH.pr,ih=H-CH.pt-CH.pb,cw=iw/n,bw=Math.max(4,Math.min(46,cw*.72));
  const y=v=>CH.pt+ih-(v/chartMax)*ih;
  const tickStep=chartMax>120?40:20,nowIdx=nowIndex(p);
  let g="";
  for(let v=0;v<=chartMax;v+=tickStep)g+=`<line class="grid" x1="${CH.pl}" x2="${W-CH.pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${CH.pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const every=cw<22?2:1;
  p.weeks.forEach((w,i)=>{
    const cx=CH.pl+cw*i+cw/2,v=+w.miles||0,top=y(v),col=`var(--${(w.type||"Easy").toLowerCase()})`;
    const d=addDays(mondayOf(toD(p.start)),i*7);
    g+=`<g class="wk${i===nowIdx?" now":""}" data-i="${i}">
      <rect class="col" x="${CH.pl+cw*i}" y="${CH.pt}" width="${cw}" height="${ih+CH.pb}"/>
      <rect class="bar" x="${cx-bw/2}" y="${top}" width="${bw}" height="${Math.max(0,CH.pt+ih-top)}" rx="2" fill="${col}"/>
      ${v?`<rect class="handle" x="${cx-bw/2}" y="${top-1.5}" width="${bw}" height="3" rx="1.5"/>`:""}
      ${v&&cw>=20?`<text class="ml" x="${cx}" y="${top-5}" text-anchor="middle">${v}</text>`:""}
      ${i%every===0?`<text x="${cx}" y="${H-CH.pb+15}" text-anchor="middle">W${i+1}</text><text x="${cx}" y="${H-CH.pb+28}" text-anchor="middle" style="font-size:10px">${d.getUTCMonth()+1}/${d.getUTCDate()}</text>`:""}
    </g>`;
  });
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.innerHTML=g;
}
function chartPos(e){
  const svg=$("#chart"),r=svg.getBoundingClientRect(),p=P(),n=p.weeks.length;
  const W=r.width,ih=240-CH.pt-CH.pb,cw=(W-CH.pl-CH.pr)/n;
  const x=e.clientX-r.left,yy=(e.clientY-r.top)*(240/r.height);
  const i=Math.max(0,Math.min(n-1,Math.floor((x-CH.pl)/cw)));
  const v=Math.max(0,Math.min(chartMax,Math.round((CH.pt+ih-yy)/ih*chartMax)));
  const top=CH.pt+ih-((+p.weeks[i].miles||0)/chartMax)*ih;
  return{i,v,nearTop:Math.abs(yy-top)<16||yy>top};
}
function setMiles(i,v){
  const p=P();if(!p.weeks[i]||p.weeks[i].miles===v)return;
  p.weeks[i].miles=v;

}
document.addEventListener("pointerdown",e=>{
  const svg=e.target.closest&&e.target.closest("#chart");if(!svg||!P())return;
  const pos=chartPos(e);
  CH.down={i:pos.i,x:e.clientX,y:e.clientY};

});
document.addEventListener("pointermove",e=>{

document.addEventListener("pointerup",e=>{

function commitEditor(){

  if(action){const b=document.createElement("button");b.type="button";b.textContent=action.label;b.onclick=()=>{el.remove();action.fn()};el.appendChild(b)}
  document.body.appendChild(el);setTimeout(()=>el.remove(),action?8000:2600);

async function copyText(text,okMsg){

function exportable(p){const o=stripId(p);o.athlete=athleteName(p);o.format="block-builder/1";return o}
function csv(p){
  const Pc=paces(p),q=s=>`"${String(s??"").replace(/"/g,'""')}"`;
  const rows=[["Week","Week of","Type","Miles",...DAYS_LONG,"Strava links"]];
  p.weeks.forEach((w,i)=>rows.push([i+1,iso(addDays(mondayOf(toD(p.start)),i*7)),w.type,w.miles??"",...w.days.map(d=>plainText(d,Pc)),DAYS.map((dn,k)=>linkOf(w,k)?dn+": "+linkOf(w,k):"").filter(Boolean).join("\n")]));
  return rows.map(r=>r.map(q).join(",")).join("\n");

    a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast("Downloaded "+filename);return;

/* ---------- training mix ---------- */
// Slot order is fixed (validated palette order); stacked segments follow it.
const MIX=[["aerobic","Aerobic",1],["mp","Marathon pace",2],["threshold","Threshold",3],["intervals","Intervals",4],["speed","Speed",5],["hills","Hills",6],["fartlek","Fartlek",7],["other","Race & other",8]];
const MIX_ZONE={MP:"mp",HMP:"threshold",T:"threshold","10K":"intervals","5K":"intervals",MILE:"speed"};
// Literal paces like "10 x 400 @ 75" or "5x1k @ 3:20" are matched to the nearest training pace for this goal.
function literalZones(s,Pc){
  const out=new Set();if(!Pc)return out;
  const re=/(\d+(?:\.\d+)?)\s*(mi|mile|k|km|m)?\s*@\s*(\d{1,2}:\d{2}|\d{2,3})(?![\d:])/gi;let m;
  while((m=re.exec(s))){
    const n=+m[1],u=(m[2]||"").toLowerCase(),t=m[3].includes(":")?(+m[3].split(":")[0])*60+(+m[3].split(":")[1]):+m[3];
    const meters=u.startsWith("mi")?n*1609.344:u==="k"||u==="km"?n*1000:u==="m"||n>=100?n:n*1609.344;
    if(!meters||!t)continue;
    const pace=t/(meters/1609.344);
    if(pace>Pc.MP+20){out.add("aerobic");continue}
    let best=null,bd=Infinity;for(const z in MIX_ZONE){const d=Math.abs(Pc[z]-pace);if(d<bd){bd=d;best=z}}
    out.add(MIX_ZONE[best]);
  }
  return out;
}
// What kind of training a day's text is. Returns category keys, "rest", or null for an empty day.
function classifyDay(text,Pc){
  const s=String(text||"").toLowerCase().trim();
  if(!s)return null;
  if(/race day/.test(s))return["other"];
  if(/^(rest|off)\b/.test(s))return"rest";
  const c=new Set();
  if(/\{mile/.test(s)||/mile pace|\bfly|flying|\b150s?\b|x\s*150\b/.test(s))c.add("speed");
  if(/\{(5k|10k)/.test(s)||/5k pace|10k pace|5k effort|\bcv\b/.test(s))c.add("intervals");
  if(/\{(t|hmp)[}\/]/.test(s)||/tempo|threshold|\bhmp\b|cruise/.test(s))c.add("threshold");
  if(/\{mp[}\/]/.test(s)||/\bmp\b|marathon pace/.test(s))c.add("mp");
  if(/hill/.test(s))c.add("hills");
  if(/fartlek|on\s*\/\s*off|min on|\d-\d-\d-\d|surge/.test(s))c.add("fartlek");
  literalZones(s,Pc).forEach(x=>{if(x!=="aerobic")c.add(x)});
  if(!c.size&&/escalation|progression/.test(s))c.add("mp");
  if(!c.size&&/\d+\s*x\s*\d/.test(s))c.add("intervals");
  if(c.size)return[...c];
  if(/easy|recovery|long run|shakeout|strides|pre-?race|cross|\d+\s*mi\b/.test(s))return["aerobic"];
  return["other"];
}
// Share of running days by type. A day with two kinds of work counts half to each.
function trainingMix(p){
  const Pc=paces(p),tot={},weeks=[];let run=0,rest=0,blank=0;
  MIX.forEach(([k])=>tot[k]=0);
  p.weeks.forEach((w,wi)=>{
    const wk={};MIX.forEach(([k])=>wk[k]=0);let wr=0;
    w.days.forEach(t=>{const c=classifyDay(t,Pc);
      if(c===null){blank++;return}if(c==="rest"){rest++;return}
      run++;wr++;c.forEach(k=>{tot[k]+=1/c.length;wk[k]+=1/c.length})});
    weeks.push({wi,wk,run:wr,type:w.type});
  });
  const hard=run-tot.aerobic;
  return{tot,weeks,run,rest,blank,hard};
}
const pct=(x,n)=>{if(!n||!x)return 0;const v=Math.round(x/n*100);return v||"<1"};
const fmtDays=x=>Number.isInteger(x)?String(x):x.toFixed(1);
function mixHTML(p){
  const m=trainingMix(p);
  if(!m.run)return `<p class="hint" style="margin-top:8px">Add workouts to see how the plan splits between easy running and harder sessions.</p>`;
  const segs=MIX.filter(([k])=>m.tot[k]>0).map(([k,l,n])=>`<span style="flex:${m.tot[k]};background:var(--m${n})" data-tip="${esc(l)}: ${pct(m.tot[k],m.run)}% · ${fmtDays(m.tot[k])} of ${m.run} running days"></span>`).join("");
  const leg=MIX.map(([k,l,n])=>`<li class="${m.tot[k]?"":"zero"}"><i style="background:var(--m${n})"></i><span>${l}<small>${fmtDays(m.tot[k])} day${m.tot[k]===1?"":"s"}</small></span><b>${pct(m.tot[k],m.run)}%</b></li>`).join("");
  const cols=m.weeks.map(w=>{
    const tip=`W${w.wi+1} · ${w.type} · ${w.run} running day${w.run===1?"":"s"}\n`+MIX.filter(([k])=>w.wk[k]>0).map(([k,l])=>`${l}: ${fmtDays(w.wk[k])}`).join("\n");
    return `<div class="mix-col" data-tip="${esc(tip)}" aria-label="${esc(tip.replace(/\n/g,", "))}">${MIX.filter(([k])=>w.wk[k]>0).map(([k,,n])=>`<span style="height:calc(${w.wk[k]/7*100}% - 2px);background:var(--m${n})"></span>`).join("")}</div>`;
  }).join("");
  const perWeek=(m.hard/p.weeks.length).toFixed(1);
  return `<div class="mix-bar" role="img" aria-label="Training mix: ${MIX.filter(([k])=>m.tot[k]).map(([k,l])=>`${l} ${pct(m.tot[k],m.run)}%`).join(", ")}">${segs}</div>
    <ul class="mix-leg">${leg}</ul>
    <div class="mix-sum"><span>Easy vs harder: <b>${pct(m.tot.aerobic,m.run)}% / ${pct(m.hard,m.run)}%</b></span><span><b>${perWeek}</b> harder sessions a week</span><span><b>${m.run}</b> running days · ${m.rest} rest${m.blank?` · ${m.blank} not planned yet`:""}</span></div>
    <p class="hint" style="margin:16px 0 0">By week: each column is that week's running days (up to 7), split by type. Hover for details.</p>
    <div class="mix-weeks" aria-label="Training mix by week">${cols}</div>
    <div class="mix-wl">${m.weeks.map(w=>`<span>${(w.wi+1)%2===1||m.weeks.length<14?"W"+(w.wi+1):""}</span>`).join("")}</div>`;

    if(!a){a=newAthlete(name);S.athletes[a.id]=a;saveAthlete(a)}

function ptTitle(p){const a=S.athletes[p.athleteId];return "PT: "+concernsOf(a).map(c=>areaOf(c.area).name).join(", ")}
// Strength days from the training week: workout days first, then easy days, at least a day apart;
// never the long-run day, the day before it, rest days, or the two days before a race.
function autoPtDays(p,wi){
  const w=p.weeks[wi];if(!w)return[];
  const L=+p.settings.longDay,ks=w.days.map(kind),block=new Set([L]);
  if(L>0)block.add(L-1);
  let target=2;
  if(wi===p.weeks.length-1){const r=dow(toD(p.raceDate));for(let d=Math.max(0,r-2);d<7;d++)block.add(d);target=1}
  ks.forEach((k,d)=>{if(k==="race"||k==="rest")block.add(d)});
  const score=d=>(ks[d]==="work"?0:1)+(d===L+1?2:0);
  const picks=[];
  for(const d of [0,1,2,3,4,5,6].filter(d=>!block.has(d)).sort((x,y)=>score(x)-score(y)||x-y)){
    if(picks.length>=target)break;if(picks.some(x=>Math.abs(x-d)<2))continue;picks.push(d);
  }
  return picks.sort((a,b)=>a-b);
}
function ptDaysFor(p,wi){
  const a=p&&S.athletes[p.athleteId];if(!concernsOf(a).length)return[];
  if(Array.isArray(a.ptDays)){const w=p.weeks[wi];return a.ptDays.filter(d=>w&&kind(w.days[d])!=="race")}
  return autoPtDays(p,wi);
}
function exItems(a,strengthDay){
  return concernsOf(a).map(c=>{const ar=areaOf(c.area);
    const items=ar.ex.filter(([,,t])=>t==="daily"||strengthDay).map(([n,dose,t])=>({n,dose,t,held:t==="load"&&c.sev==="painful"}));
    return{c,ar,items};
  }).filter(g=>g.items.length);
}
function ptDayBox(p,wi,di){
  const a=S.athletes[p.athleteId];if(!concernsOf(a).length)return"";
  if(kind(p.weeks[wi].days[di])==="race")return"";
  const strength=ptDaysFor(p,wi).includes(di),groups=exItems(a,strength);
  return `<section class="card ptbox"><div class="card-h"><h3>PT today</h3><span class="hint">${strength?"Strength day":"Light work only"} · <button class="back" data-act="open-athlete" data-id="${a.id}">Edit ${esc(a.name)}'s PT</button></span></div>

function teamRows(wk){
  return sortedAthletes().map(a=>({a,days:DAYS.map((_,di)=>{
    const r=planOn(a.id,addDays(wk,di));if(!r)return null;
    const w=r.p.weeks[r.wi],t=w.days[r.di]||"";
    return{p:r.p,wi:r.wi,di:r.di,t,k:kind(t),sch:schedOf(w,r.di),link:linkOf(w,r.di),pt:ptDaysFor(r.p,r.wi).includes(r.di),w};
  })}));
}
// Overlap on one day, strongest first:
//   same time (start times within TOGETHER_MIN, any place) = could work out together (green);
//   same place at different times = shared venue; several workouts with neither = could pair up.
const TOGETHER_MIN=30;
const mins=t=>{const [h,m]=String(t||"").split(":").map(Number);return h*60+m};
const runs=k=>k!=="rest"&&k!=="empty";
const bestSpelling=list=>list.map(x=>x.trim()).sort((x,y)=>(y!==y.toLowerCase())-(x!==x.toLowerCase()))[0];
function overlaps(rows){
  const out=[],sharedCells=new Set(),togetherCells=new Set();
  for(let di=0;di<7;di++){
    const ents=rows.map(r=>({a:r.a,c:r.days[di]})).filter(m=>m.c&&runs(m.c.k));
    const together=new Set();
    const timed=ents.filter(m=>m.c.sch.t).sort((x,y)=>mins(x.c.sch.t)-mins(y.c.sch.t));
    let grp=[];
    const close=()=>{
      if(grp.length>1){
        const locs=grp.map(m=>m.c.sch.loc.trim()).filter(Boolean),same=locs.length===grp.length&&new Set(locs.map(x=>x.toLowerCase())).size===1;
        out.push({di,kind:"time",members:grp,samePlace:same,loc:same?bestSpelling(locs):""});
        grp.forEach(m=>{togetherCells.add(m.a.id+":"+di);together.add(m.a.id)});
      }
      grp=[];
    };
    for(const m of timed){if(grp.length&&mins(m.c.sch.t)-mins(grp[0].c.sch.t)>TOGETHER_MIN)close();grp.push(m)}
    close();
    const groups={},inPlace=new Set();
    ents.forEach(m=>{if(m.c.sch.loc){const k=m.c.sch.loc.trim().toLowerCase();(groups[k]=groups[k]||[]).push(m)}});
    for(const k in groups){
      const g=groups[k];if(g.length<2||g.every(m=>together.has(m.a.id)))continue;
      out.push({di,kind:"place",loc:bestSpelling(g.map(m=>m.c.sch.loc)),members:g});
      g.forEach(m=>{sharedCells.add(m.a.id+":"+di);inPlace.add(m.a.id)});
    }
    const work=ents.filter(m=>m.c.k==="work"&&!together.has(m.a.id)&&!inPlace.has(m.a.id));
    if(work.length>1)out.push({di,kind:"work",members:work});
  }
  return{list:out,sharedCells,togetherCells};
}
// Other athletes whose session on this date starts within TOGETHER_MIN of this one.
function partnersOn(p,wi,di){
  const sc=schedOf(p.weeks[wi],di);if(!sc.t||!runs(kind(p.weeks[wi].days[di])))return[];
  const d=addDays(mondayOf(toD(p.start)),wi*7+di),out=[];
  for(const a of sortedAthletes()){
    if(a.id===p.athleteId)continue;
    const r=planOn(a.id,d);if(!r)continue;
    const w=r.p.weeks[r.wi],o=schedOf(w,r.di);
    if(o.t&&runs(kind(w.days[r.di]))&&Math.abs(mins(o.t)-mins(sc.t))<=TOGETHER_MIN)out.push({a,t:o.t,loc:o.loc});
  }
  return out;
}

const randHex=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>b.toString(16).padStart(2,"0")).join("");
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("Couldn't load "+src));document.head.appendChild(s)})}
async function initCloud(){
  S.mode="cloud";status("Connecting to the shared plans…");renderTop();
  try{
    if(!window.supabase)await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js");
    S.sb=window.supabase.createClient(SB_CFG.url,SB_CFG.anonKey);
    const {data}=await S.sb.auth.getSession();
    const sess=data&&data.session;
    if(sess){S.coachEmail=sess.user&&sess.user.email;S.coach=await checkCoach()}
  }catch(e){
    S.mode="local";status("Couldn't reach the shared plans. Showing plans saved in this browser.",true);
    try{const raw=JSON.parse(lsGet(LS)||"{}");for(const id in raw)S.plans[id]=Object.assign(raw[id],{id})}catch(x){}
    try{const raw=JSON.parse(lsGet(LSA)||"{}");for(const id in raw)S.athletes[id]=Object.assign(raw[id],{id})}catch(x){}
    renderTop();afterLoad(true);return;
  }
  if(S.athLink&&!S.coach)S.page="plan";
  await refreshCloud(true);
  const again=()=>{if(document.visibilityState==="visible")refreshCloud(false)};
  setInterval(again,120000);document.addEventListener("visibilitychange",again);
}
// Supabase refused a write: work out whether the sign-in lapsed or the login isn't a coach, say which,
// and keep the edits as unsaved so nothing is lost.
async function cloudWriteFailed(e,planId){
  const msg=(e&&e.message)||"";
  const denied=/row-level security|permission denied|JWT|not authorized/i.test(msg);
  if(planId&&planId===S.cur&&S.draft){
    S.unsaved=true;
    lsSet("blockbuilder.draft",JSON.stringify({id:S.cur,base:null,plan:stripId(S.draft)}));
  }
  if(!denied){status("Not saved: "+(msg||"check your connection")+". Your changes are kept. Press Save to try again.",true);renderTop();return}
  let sess=null;try{sess=(await S.sb.auth.getSession()).data.session}catch(x){}
  const coach=sess?await checkCoach():false;
  if(!sess){S.coach=false;status("Not saved: you've been signed out. Sign in again, then press Save. Your changes are kept.",true)}
  else if(!coach){S.coach=false;status(`Not saved: ${sess.user&&sess.user.email||"this login"} isn't on the coach list in Supabase. Your changes are kept.`,true)}
  else status("Not saved: Supabase refused the change. Check the policies from supabase-setup.sql. Your changes are kept.",true);
  render();
}
async function recheckCoach(){
  let sess=null;try{sess=(await S.sb.auth.getSession()).data.session}catch(x){}
  if(sess&&await checkCoach())return;
  S.coach=false;
  status(sess?`${sess.user&&sess.user.email||"This login"} isn't on the coach list in Supabase, so editing is off.`:"You've been signed out. Sign in again to keep editing.",true);
}
async function checkCoach(){try{const {data,error}=await S.sb.rpc("is_coach");return !error&&data===true}catch(e){return false}}
async function refreshCloud(first){
  if(S.refreshing)return;S.refreshing=true;
  try{
    const [pl,at]=await Promise.all([S.sb.from("plans").select("id,data"),S.sb.from("athletes").select("id,name,color")]);
    const err=pl.error||at.error;if(err)throw err;
    const priv={};
    if(S.coach){const r=await S.sb.from("athlete_private").select("id,data,token");if(r.error)throw r.error;r.data.forEach(x=>priv[x.id]=Object.assign({},x.data,{token:x.token}))}
    else if(S.athLink){const r=await S.sb.rpc("athlete_view",{p_athlete:S.athLink.id,p_token:S.athLink.token});if(!r.error&&r.data)priv[S.athLink.id]=Object.assign({},r.data,{token:S.athLink.token});else S.athLinkBad=true}
    if(S.coach)await recheckCoach();
    let curChanged=false;const seen=new Set();
    pl.data.forEach(row=>{seen.add(row.id);if(S.dirty.has(row.id))return;const d=Object.assign(row.data||{},{id:row.id}),have=S.plans[row.id];
      if(!have||have.updatedAt!==d.updatedAt){S.plans[row.id]=d;if(row.id===S.cur)curChanged=true}});
    for(const id of Object.keys(S.plans))if(!seen.has(id)&&!S.dirty.has(id)){delete S.plans[id];if(id===S.cur)curChanged=true}
    const next={};
    at.data.forEach(r=>{next[r.id]=Object.assign({id:r.id,name:r.name,color:r.color||0,notes:"",concerns:[],ptDays:null},priv[r.id]||{})});
    for(const id in S.athletes)if(S.athPending&&S.athPending.has(id))next[id]=S.athletes[id];
    S.athletes=next;
    await loadRequests();
    S.plansLoaded=S.athLoaded=true;
    if(first||(!S.statusErr&&!S.unsaved))status(S.coach?"Signed in as coach · saves go to everyone":athleteMode()?`Hi ${(S.athletes[S.athLink.id]||{}).name||""} · your coach's latest plan`:S.athLinkBad?"This athlete link isn't valid any more. Ask your coach for a new one.":"View only · coaches sign in to edit");
    if(first&&athleteMode()){S.athSel=S.athLink.id;const f=focusPlan(S.athLink.id);if(f)S.cur=null,setCurrent(f.p.id)}
    afterLoad(curChanged||first);
    if(!first&&!S.editing&&!typingInApp()&&!$("#scrim"))render();
  }catch(e){status("Couldn't load the shared plans: "+(e&&e.message||"check your connection"),true);if(first){afterLoad(true)}}
  S.refreshing=false;
}
async function cloudSaveAthlete(a){
  const now=new Date().toISOString();
  let r=await S.sb.from("athletes").upsert({id:a.id,name:a.name,color:a.color||0,updated_at:now});if(r.error)throw r.error;
  const row={id:a.id,data:{notes:a.notes||"",concerns:a.concerns||[],ptDays:Array.isArray(a.ptDays)?a.ptDays:null},updated_at:now};
  if(a.token)row.token=a.token;
  r=await S.sb.from("athlete_private").upsert(row).select("token").single();if(r.error)throw r.error;
  a.token=r.data.token;
}

  if(!a.token)return `<section class="card"><h2>Athlete link</h2><p class="hint" style="margin-top:6px">Making ${esc(a.name)}'s private link… reload in a moment if it doesn't appear.</p></section>`;
  return `<section class="card"><h2>Athlete link</h2>
    <p class="hint" style="margin-top:6px">Send this to ${esc(a.name)}. It opens their plan and PT, and lets them ask you for changes. Anyone with it can see ${esc(a.name)}'s PT notes, so only send it to them.</p>
    <div class="linkrow"><input type="text" readonly id="ath-link" value="${esc(athleteLink(a))}" aria-label="Athlete link"><button class="btn primary" data-act="copy-ath-link" data-id="${a.id}">Copy link</button><button class="btn ghost" data-act="new-ath-link" data-id="${a.id}">Make a new link</button></div></section>`;
}

function signInModal(){
  modal(`<h3>Coach sign in</h3>
    <div class="field"><label for="si-email">Email</label><input type="email" id="si-email" autocomplete="username"></div>
    <div class="field"><label for="si-pass">Password</label><input type="password" id="si-pass" autocomplete="current-password"></div>

  $("#si-pass").addEventListener("keydown",e=>{if(e.key==="Enter")doSignIn()});
}
async function doSignIn(){
  const email=$("#si-email").value.trim(),password=$("#si-pass").value,err=$("#m-err");
  if(!email||!password){err.textContent="Enter your email and password.";return}
  err.textContent="Signing in…";
  const {data,error}=await S.sb.auth.signInWithPassword({email,password});
  if(error){err.textContent=error.message==="Invalid login credentials"?"That email and password don't match a coach login.":error.message;return}
  if(!(await checkCoach())){await S.sb.auth.signOut();err.textContent="This login isn't on the coach list. Add its email to the coaches table in Supabase (see the setup file).";return}
  S.coach=true;S.coachEmail=data.user&&data.user.email;closeModal();S.athLink=null;
  S.statusErr=false;
  await refreshCloud(true);render();toast(S.unsaved?"Signed in. Press Save to save the changes you kept.":"Signed in. Your saves now update everyone's view.");
}

/* sharing setup + moving this browser's plans up */
function localCounts(){let p=0,a=0;try{p=Object.keys(JSON.parse(lsGet(LS)||"{}")).length;a=Object.keys(JSON.parse(lsGet(LSA)||"{}")).length}catch(e){}return{p,a}}

  }

      <div class="btns" style="display:flex;gap:8px;margin-top:8px"><button class="btn primary" data-act="upload-local">Upload ${lc.p} plan${lc.p===1?"":"s"}</button></div></section>`;

async function uploadLocal(btn){
  btn.disabled=true;btn.textContent="Uploading…";
  try{
    const lp=JSON.parse(lsGet(LS)||"{}"),la=JSON.parse(lsGet(LSA)||"{}");
    const byName=n=>Object.values(S.athletes).find(x=>x.name.trim().toLowerCase()===String(n||"").trim().toLowerCase());
    const map={};
    for(const id in la){const loc=la[id],ex=byName(loc.name);
      if(ex){map[id]=ex.id;continue}
      const a=Object.assign({},loc,{id});delete a.token;S.athletes[id]=a;await cloudSaveAthlete(a);map[id]=id}
    let n=0;
    for(const id in lp){
      const p=Object.assign({},lp[id],{id});
      if(Object.values(S.plans).some(x=>x.name===p.name&&x.raceDate===p.raceDate))continue;
      if(p.athleteId&&map[p.athleteId])p.athleteId=map[p.athleteId];
      p.updatedAt=Date.now();S.plans[id]=p;
      const {error}=await S.sb.from("plans").upsert({id,data:stripId(p),updated_at:new Date().toISOString()});if(error)throw error;n++;
    }
    lsSet("blockbuilder.uploaded","1");
    await refreshCloud(false);render();toast(`Uploaded ${n} plan${n===1?"":"s"}`);
  }catch(e){btn.disabled=false;btn.textContent="Try again";toast("Upload stopped: "+(e&&e.message||"try again"))}
}

// Athlete link: save the athlete's chosen PT days (null = back to suggested).
async function athleteSetPtDays(days){
  const at=S.athletes[S.athLink.id];if(!at)return;
  const prev=at.ptDays;at.ptDays=days;renderAthlete();
  const {error}=await S.sb.rpc("set_pt_days",{p_athlete:S.athLink.id,p_token:S.athLink.token,p_days:days});
  if(error){
    at.ptDays=prev;renderAthlete();
    toast(/set_pt_days|function/i.test(error.message)?"Choosing PT days isn't switched on yet. Ask your coach to run the PT days update in Supabase.":"Not saved: "+error.message);
    return;
  }
  toast(days?"PT days saved. They're in your plan now.":"Back to your coach's suggested days");
}

/* ---------- change requests ---------- */
async function loadRequests(){
  if(S.mode!=="cloud")return;
  if(S.coach){const r=await S.sb.from("requests").select("*").order("created_at",{ascending:false}).limit(300);if(!r.error)S.requests=r.data}
  else if(athleteMode()){const r=await S.sb.rpc("my_requests",{p_athlete:S.athLink.id,p_token:S.athLink.token});if(!r.error)S.requests=r.data||[]}
}
const openRequests=()=>(S.requests||[]).filter(r=>r.status==="open");
// The day a request is about, following the date if the plan's start moved since.
function requestIndex(r){
  const p=planById(r.plan_id);let i=r.week_index*7+r.day_index;
  if(p&&r.day_date){const j=Math.round((toD(r.day_date)-mondayOf(toD(p.start)))/DAY_MS);if(j>=0&&j<p.weeks.length*7)i=j}
  return i;
}
function requestOn(pid,wi,di){if(S.mode!=="cloud"||!S.requests)return false;return openRequests().some(r=>r.plan_id===pid&&requestIndex(r)===wi*7+di)}
const ST_LABEL={open:"Waiting for coach",approved:"Approved",declined:"Declined",done:"Answered"};
function requestsSection(list,coach,title){
  const open=list.filter(r=>r.status==="open"),done=list.filter(r=>r.status!=="open");
  if(coach&&!list.length)return"";
  const card=r=>{
    const p=planById(r.plan_id),ath=S.athletes[r.athlete_id],Pc=p?paces(p):null,d=r.day_date?toD(r.day_date):null;
    const when=d?`${DAYS[dow(d)]} ${fmtD(d)}`:`Week ${r.week_index+1}, ${DAYS[r.day_index]}`;
    return `<article class="rq-card">
      <div class="rq-top">${coach?`<b>${esc(ath?ath.name:"Athlete")}</b>`:""}<span class="when">${when}${p?" · "+esc(p.name):""}</span><span class="st st-${r.status}">${ST_LABEL[r.status]||r.status}</span></div>
      <div class="rq-msg">${esc(r.message)}</div>
      <div class="rq-cols"><div class="rq-box"><span class="k">Planned</span>${r.planned?resolveText(r.planned,Pc):"—"}</div>${r.suggestion?`<div class="rq-box"><span class="k">${coach?"They suggest":"You suggested"}</span>${resolveText(r.suggestion,Pc)}</div>`:""}</div>
      ${r.reply?`<div class="rq-box"><span class="k">${coach?"Your reply":"Coach's reply"}</span>${esc(r.reply)}</div>`:""}
      ${coach&&r.status==="open"?`<div class="rq-acts"><input type="text" id="rr-${r.id}" placeholder="Reply (optional)" aria-label="Reply">
        ${r.suggestion?`<button class="btn primary" data-act="rq-approve" data-id="${r.id}" title="Replace the planned workout with their suggestion">Approve & apply</button>`:""}
        <button class="btn" data-act="rq-done" data-id="${r.id}">${r.suggestion?"Answer without changing":"Mark answered"}</button>
        <button class="btn ghost" data-act="rq-decline" data-id="${r.id}">Decline</button>
        ${p?`<button class="btn ghost" data-act="rq-open" data-id="${r.id}">Open day</button>`:""}</div>`:""}
    </article>`;
  };
  return `<section style="margin-bottom:22px"><div class="sect-h" style="margin-top:6px"><h2>${esc(title||(coach?"Change requests":"Your requests"))}</h2><span class="hint">${open.length} open</span></div>
    ${!list.length?`<p class="hint">No requests yet. Tap any day in your plan to ask your coach for a change.</p>`:""}
    <div class="rqs">${open.map(card).join("")}</div>
    ${done.length?`<details><summary class="hint" style="cursor:pointer;margin-bottom:8px">Answered (${done.length})</summary><div class="rqs">${done.map(card).join("")}</div></details>`:""}</section>`;
}
function requestModal(wi,di){
  const p=P();if(!p)return;
  const w=p.weeks[wi],d=addDays(mondayOf(toD(p.start)),wi*7+di),t=w.days[di]||"";
  S.rq={wi,di,date:iso(d),planned:t};
  modal(`<h3>Request a change</h3>
    <p class="hint">${DAYS_LONG[di]}, ${fmtD(d)} · ${esc(p.name)}</p>
    <div class="rq-box"><span class="k">Planned</span>${t?resolveText(t,paces(p)):"—"}</div>
    <div class="field"><label for="rq-msg">What would you like to change, and why?</label><textarea id="rq-msg" class="io" style="font-family:inherit;font-size:14px" placeholder="e.g. Calf is tight after Sunday. Could I swap this to an easy run?"></textarea></div>
    <div class="field"><label for="rq-sug">Suggested workout (optional)</label><textarea id="rq-sug" class="io" style="font-family:inherit;font-size:14px" placeholder="e.g. Easy 8mi"></textarea>
      <small class="hint">If your coach approves, this replaces the planned workout.</small></div>
    <p class="hint" id="m-err"></p>
    <div class="acts"><button class="btn ghost" data-act="close">Cancel</button><button class="btn primary" data-act="rq-send">Send to coach</button></div>`);
}
async function sendRequest(btn){
  const msg=$("#rq-msg").value.trim(),sug=$("#rq-sug").value.trim(),err=$("#m-err"),p=P(),q=S.rq;
  if(!msg){err.textContent="Write a short note about the change.";return}
  btn.disabled=true;err.textContent="Sending…";
  const {error}=await S.sb.rpc("submit_request",{p_athlete:S.athLink.id,p_token:S.athLink.token,p_plan:p.id,p_week:q.wi,p_day:q.di,p_date:q.date,p_planned:q.planned,p_message:msg,p_suggestion:sug||null});
  if(error){btn.disabled=false;err.textContent=error.message;return}
  closeModal();await loadRequests();render();toast("Sent to your coach");
}
async function answerRequest(id,kind,btn){
  const r=(S.requests||[]).find(x=>x.id===id);if(!r)return;
  const reply=($("#rr-"+id)||{}).value||"";
  btn.disabled=true;
  try{
    if(kind==="approve"){
      const saved=S.plans[r.plan_id];if(!saved)throw new Error("That plan no longer exists");
      const i=requestIndex(r),wi=Math.floor(i/7),di=i%7;
      saved.weeks[wi].days[di]=r.suggestion;saved.updatedAt=Date.now();
      if(r.plan_id===S.cur){if(S.unsaved)S.draft.weeks[wi].days[di]=r.suggestion;else S.draft=clone(saved)}
      S.dirty.add(r.plan_id);await flush(r.plan_id);
    }
    const status={approve:"approved",decline:"declined",done:"done"}[kind];
    const {error}=await S.sb.from("requests").update({status,reply:reply.trim()||null,resolved_at:new Date().toISOString()}).eq("id",id);
    if(error)throw error;
    await loadRequests();render();
    toast(kind==="approve"?"Approved. The plan is updated for everyone.":kind==="decline"?"Declined":"Marked answered");
  }catch(e){btn.disabled=false;toast("Couldn't update the request: "+(e&&e.message||"try again"))}
}

/* ---------- share links (standalone site): #plan=<deflated, base64url JSON> ---------- */
const b64u=bytes=>{let s="";for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const unb64u=str=>{const s=atob(str.replace(/-/g,"+").replace(/_/g,"/"));const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b};
async function encodePlan(o){
  const raw=new TextEncoder().encode(JSON.stringify(o));
  if(window.CompressionStream){const buf=await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer();return "z"+b64u(new Uint8Array(buf))}
  return "j"+b64u(raw);
}
async function decodePlan(code){
  const bytes=unb64u(code.slice(1));
  const raw=code[0]==="z"?new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer()):bytes;
  return JSON.parse(new TextDecoder().decode(raw));
}
function cleanImported(o){
  if(!o||!Array.isArray(o.weeks)||!o.start||!o.raceDate)throw new Error("missing weeks or dates");
  delete o.format;delete o.id;delete o.athleteId;
  o.settings=Object.assign({startMiles:50,peakMiles:80,step:6,qualityDay:2,longDay:5},o.settings||{});
  o.weeks=o.weeks.map(w=>({type:TYPES.includes(w.type)?w.type:"Easy",miles:w.miles==null||w.miles===""?null:+w.miles,days:Array.from({length:7},(_,i)=>String((w.days||[])[i]||"")),...(Array.isArray(w.links)?{links:Array.from({length:7},(_,i)=>stravaUrl(w.links[i])||"")}:{}),...(Array.isArray(w.sched)?{sched:Array.from({length:7},(_,i)=>{const x=w.sched[i];return x&&(x.t||x.loc)?{t:/^\d\d:\d\d$/.test(x.t)?x.t:"",loc:String(x.loc||"").slice(0,80)}:null})}:{})}));
  o.dist=+o.dist||26.2188;o.goal=String(o.goal||"3:00:00");o.name=String(o.name||"Shared plan");
  resize(o);return o;
}
async function openSharedLink(){
  const m=location.hash.match(/^#plan=([zj][A-Za-z0-9_-]+)$/);if(!m)return;
  history.replaceState(null,"",location.pathname+location.search);
  try{
    const o=cleanImported(await decodePlan(m[1]));S.sharedPlan=o;
    const Pc=paces(o),miles=o.weeks.map(w=>+w.miles||0);
    modal(`<h3>Shared plan</h3><p><strong>${esc(o.name)}</strong>${o.athlete?" · "+esc(o.athlete):""}</p>
      <p class="hint">${o.weeks.length} weeks to ${esc(fmtLong(toD(o.raceDate)))} · goal ${esc(o.goal)}${Pc?" ("+fmtSec(Pc.MP,1)+"/mi)":""} · peak ${Math.max(0,...miles)} mi</p>
      <p class="hint">Add it to the plans saved in this browser to view and edit it. Your changes won't affect the sender's copy.</p>
      <div class="acts"><button class="btn ghost" data-act="close">Not now</button><button class="btn primary" data-act="shared-add">Add to my plans</button></div>`);
  }catch(e){toast("That share link is incomplete. Ask for the link again.")}
}

initStore().then(()=>{if(STANDALONE)openSharedLink()});
window.addEventListener("hashchange",()=>{if(STANDALONE)openSharedLink()});
})();
