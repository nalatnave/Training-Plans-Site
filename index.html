<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marathon Block Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style id="app-css">
/* Layout: a training-log desk. Header with race facts, then the mileage profile beside the pace sheet, then the week-by-week calendar. */
:root{
  --paper:#EEF2F5; --surface:#FFFFFF; --sunk:#F5F7F9; --ink:#132030; --muted:#5A6878; --line:#D6DDE4;
  --accent:#C8452B; --accent-ink:#FFFFFF; --accent-soft:#F8E3DD;
  --easy:#2E8B7E; --easy-soft:#E1F1EE; --medium:#C08516; --medium-soft:#F7EDD8;
  --hard:#9C2F45; --hard-soft:#F4E0E4; --taper:#6F7F92; --taper-soft:#E7ECF1; --race:#132030; --race-soft:#DCE3EA;
  --focus:#2F6FD6;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F151C; --surface:#17202A; --sunk:#1C2631; --ink:#E5EBF1; --muted:#93A1B0; --line:#2A3644;
  --accent:#EE6A4C; --accent-ink:#1A0E0A; --accent-soft:#3A221D;
  --easy:#5CC2B2; --easy-soft:#173330; --medium:#E3AA45; --medium-soft:#362B16;
  --hard:#E0738A; --hard-soft:#3A1D25; --taper:#9AAABD; --taper-soft:#222D39; --race:#E5EBF1; --race-soft:#2A3644;
  --focus:#7AA7F0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F151C; --surface:#17202A; --sunk:#1C2631; --ink:#E5EBF1; --muted:#93A1B0; --line:#2A3644;
  --accent:#EE6A4C; --accent-ink:#1A0E0A; --accent-soft:#3A221D;
  --easy:#5CC2B2; --easy-soft:#173330; --medium:#E3AA45; --medium-soft:#362B16;
  --hard:#E0738A; --hard-soft:#3A1D25; --taper:#9AAABD; --taper-soft:#222D39; --race:#E5EBF1; --race-soft:#2A3644;
  --focus:#7AA7F0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:0 120px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em;text-transform:uppercase;margin-right:6px;white-space:nowrap}
.brand b{color:var(--accent)}
.top select{min-width:0;max-width:280px;flex:1 1 180px}
.status{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.status.err{color:var(--accent)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
select,input[type=text],input[type=date],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input:hover,select:hover{border-color:var(--muted)}

/* plan header */
.head{padding-block:26px 18px;display:grid;gap:16px}
.eyebrow{font-family:var(--f-display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.title-in{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,5vw,52px);line-height:1;border:0;background:transparent;padding:0;width:100%;letter-spacing:-.005em;border-bottom:2px solid transparent;border-radius:0}
.title-in:hover{border-bottom-color:var(--line)}
.title-in:focus{border-bottom-color:var(--accent);outline:none}
.fields{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input,.field select{width:100%}
.field small{font-size:12px;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.stat{padding:10px 18px;border-right:1px solid var(--line);display:grid;gap:0;flex:1 1 120px}
.stat:last-child{border-right:0}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat .v{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .v small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500;margin-left:3px}

/* cards */
.row2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card h2{font-family:var(--f-display);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.03em;margin:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hint{font-size:13px;color:var(--muted);margin:0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

#chart{width:100%;height:240px;display:block;touch-action:none;user-select:none}
#chart text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
#chart .ml{font-family:var(--f-mono);font-size:10.5px;fill:var(--ink)}
#chart .grid{stroke:var(--line);stroke-width:1}
#chart .col{cursor:pointer;fill:transparent}
#chart .bar{transition:fill .15s}
#chart .handle{fill:var(--ink);opacity:0}
#chart g.wk:hover .handle,#chart g.wk.drag .handle{opacity:.85}
#chart g.wk.now .bar{stroke:var(--ink);stroke-width:1.5}

table.paces{width:100%;border-collapse:collapse;font-size:14px}
.paces th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:right;padding:4px 5px;border-bottom:1px solid var(--line)}
.paces th:first-child,.paces td:first-child{text-align:left}
.paces td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.paces tr:last-child td{border-bottom:0}
.paces td:first-child{font-family:var(--f-body);font-size:14px}
.code{font-family:var(--f-mono);font-size:11.5px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}
.pace-scroll{overflow-x:auto}

details.card summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
details.card summary::-webkit-details-marker{display:none}
details.card summary h2::before{content:"▸ ";color:var(--muted);font-size:16px}
details[open].card summary h2::before{content:"▾ "}
.gl-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px}
.gl-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:6px;padding:6px 10px;font-size:14px}

/* weeks */
.sect-h{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin:30px 0 10px}
.sect-h h2{font-family:var(--f-display);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.03em;margin:0}
.weeks{display:grid;gap:10px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;--tc:var(--easy);--ts:var(--easy-soft)}
.week.t-Medium{--tc:var(--medium);--ts:var(--medium-soft)}
.week.t-Hard{--tc:var(--hard);--ts:var(--hard-soft)}
.week.t-Taper{--tc:var(--taper);--ts:var(--taper-soft)}
.week.t-Race{--tc:var(--race);--ts:var(--race-soft)}
.week.now{box-shadow:0 0 0 2px var(--ink)}
.wk-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:var(--ts);border-bottom:1px solid var(--line)}
.wk-num{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1;color:var(--tc);min-width:58px}
.wk-dates{font-size:14px;font-weight:600}
.wk-head .sp{flex:1}
.wk-head select{padding:4px 6px;font-size:13px;font-weight:600;border-color:transparent;background:var(--surface)}
.wk-miles{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted)}
.wk-miles input{width:64px;padding:4px 6px;text-align:right;font-family:var(--f-mono);font-size:13px}
.togo{font-size:12px;color:var(--muted);white-space:nowrap}
.badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--ink);color:var(--paper);border-radius:4px;padding:2px 6px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.day{border-right:1px solid var(--line);padding:8px 10px 10px;min-height:86px;cursor:text;position:relative;min-width:0}
.day:last-child{border-right:0}
.day:hover{background:var(--sunk)}
.day.ro{cursor:default}
.day.drop{background:var(--accent-soft)}
.dl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between}
.dt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;margin-top:3px}
.k-empty .dt{color:var(--muted)}
.k-easy .dt,.k-rest .dt{color:var(--muted)}
.k-work .dt{font-weight:500}
.k-work{box-shadow:inset 3px 0 0 var(--tc)}
.k-race{background:var(--race-soft)}
.k-race .dt{font-family:var(--f-display);font-weight:700;font-size:18px;text-transform:uppercase}
.pz{font-family:var(--f-mono);font-size:12.5px;background:var(--ts);color:var(--ink);border-radius:3px;padding:0 3px;white-space:nowrap}
.day textarea{width:100%;min-height:70px;resize:vertical;margin-top:3px;font-size:14px;line-height:1.4;padding:5px 6px;border-color:var(--focus)}

/* view switcher */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 16px;cursor:pointer;font-weight:600;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.sect-h .grow{flex:1}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.tdy{font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase}

/* month view */
.months{display:grid;gap:22px}
.month h3{font-family:var(--f-display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 8px}
.mgrid{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mhead,.mrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 104px}
.mhead span{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:6px 8px;border-bottom:1px solid var(--line)}
.mrow{border-bottom:1px solid var(--line);--tc:var(--easy);--ts:var(--easy-soft)}
.mrow:last-child{border-bottom:0}
.mrow.t-Medium{--tc:var(--medium);--ts:var(--medium-soft)}
.mrow.t-Hard{--tc:var(--hard);--ts:var(--hard-soft)}
.mrow.t-Taper{--tc:var(--taper);--ts:var(--taper-soft)}
.mrow.t-Race{--tc:var(--race);--ts:var(--race-soft)}
.mrow .day{min-height:96px;padding:6px 8px 8px}
.mrow .dt{font-size:12.5px;line-height:1.35}
.mrow .k-race .dt{font-size:15px}
.mrow .day.out{background:var(--sunk);cursor:default}
.mrow .day.out .dl{opacity:.5}
.mwk{background:var(--ts);padding:8px;display:grid;align-content:start;gap:4px;font-size:12px;color:var(--muted)}
.mwk b{font-family:var(--f-display);font-size:18px;color:var(--tc);line-height:1}
.mwk select{font-size:12px;padding:3px 4px;font-weight:600;border-color:transparent}
.mwk .mi{font-family:var(--f-mono);color:var(--ink)}

/* day view */
.dnav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.dnav-c{flex:1;min-width:0;text-align:center}
.dnav-date{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,4vw,34px);line-height:1.05;text-transform:uppercase}
.dtools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.dayview .days{grid-template-columns:minmax(0,1fr)}
.dayview .day{min-height:150px;padding:16px 20px;border-right:0}
.dayview .dt{font-size:20px;line-height:1.45;margin-top:6px}
.dayview .k-race .dt{font-size:30px}
.dayview .day textarea{font-size:17px;min-height:120px}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;text-align:left;cursor:pointer;min-width:0;display:grid;gap:2px}
.chip:hover{border-color:var(--muted)}
.chip[aria-current="date"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chip .cd{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase}
.chip .ct{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.k-work .ct{font-weight:600}
.toast button{margin-left:12px;background:transparent;border:1px solid var(--paper);color:var(--paper);border-radius:4px;padding:2px 8px;cursor:pointer;font-size:13px}

/* token tray */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.tray-in{max-width:1240px;margin:0 auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tray .lbl{font-size:12px;color:var(--muted);margin-right:4px}
.tok{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:4px 7px;cursor:pointer}
.tok:hover{border-color:var(--muted)}
.tok b{font-weight:500;color:var(--muted);margin-left:4px}

/* share */
.share{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:30px}
.share .card p{margin:6px 0 12px;font-size:14px;color:var(--muted)}
.share .btns{display:flex;gap:8px;flex-wrap:wrap}
textarea.io{width:100%;min-height:90px;font-family:var(--f-mono);font-size:12px;margin-bottom:8px}

.empty{padding:60px 0;display:grid;gap:14px;justify-items:start;max-width:560px}
.empty h1{font-family:var(--f-display);font-size:44px;margin:0;line-height:1}
.empty p{margin:0;color:var(--muted)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.45);z-index:40;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:10px;padding:20px;width:min(520px,100%);display:grid;gap:12px;max-height:90vh;overflow:auto}
.modal h3{font-family:var(--f-display);font-size:26px;margin:0;text-transform:uppercase}
.modal .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:50;background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:6px;font-size:14px;max-width:calc(100% - 32px)}

@media (max-width:980px){
  .row2{grid-template-columns:minmax(0,1fr)}
  .fields{grid-template-columns:repeat(3,minmax(0,1fr))}
  .gl-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .share{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .wrap{padding-inline:16px}
  .top-in{padding:10px 16px}
  .fields{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gl-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .days{grid-template-columns:minmax(0,1fr)}
  .day{border-right:0;border-bottom:1px solid var(--line);min-height:0;display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;padding:8px 12px}
  .day:last-child{border-bottom:0}
  .dl{flex-direction:column;justify-content:flex-start}
  .dt{margin-top:0}
  .day textarea{grid-column:2}
  .stat{flex-basis:45%}
  .mhead,.mrow{grid-template-columns:repeat(7,minmax(0,1fr))}
  .mhead span:last-child{display:none}
  .mrow .day{min-height:64px;padding:4px 5px;border-bottom:0;display:block;border-right:1px solid var(--line)}
  .mrow .dt{font-size:10.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .mrow .k-race .dt{font-size:11px}
  .mwk{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:4px 8px}
  .mwk b{font-size:15px}
  .strip{grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
  .chip{padding:5px 4px}
  .chip .ct{display:none}
  .status{order:5;margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- paces ---------- */
function parseTime(s,dist){
  const p=String(s||"").trim().split(":").map(Number);
  if(!p.length||p.some(isNaN))return null;
  if(p.length===3)return p[0]*3600+p[1]*60+p[2];
  if(p.length===2)return dist>=13?p[0]*3600+p[1]*60:p[0]*60+p[1];

}
function fmtSec(s,forceMin){

  return h?`${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`:`${m}:${String(x).padStart(2,"0")}`;

const ZONES=[
  {k:"E",name:"Easy",d:null},
  {k:"MP",name:"Marathon",d:26.2188},
  {k:"HMP",name:"Half marathon",d:13.1094},
  {k:"T",name:"Threshold (15K)",d:9.3206},
  {k:"10K",name:"10K",d:6.2137},
  {k:"5K",name:"5K",d:3.1069},
  {k:"MILE",name:"Mile",d:1},

// Riegel: T2 = T1 * (d2/d1)^1.06. Returns seconds per mile for each zone.
function paces(plan){

  if(!T)return null;
  const per=d=>T*Math.pow(d/dist,1.06)/d;
  const out={};
  for(const z of ZONES){
    if(z.k==="E"){const mp=per(26.2188);out.E=[mp*1.2,mp*1.3];}

}

    }

  });

/* ---------- guideline (distilled from the 2026 Chicago block) ---------- */

// Workouts from the 2026 Chicago workbook, tagged with that week's Easy/Medium/Hard label.
// wk = workbook week (1-19, race in wk 19). Paces are rewritten as pace codes so they scale to any goal.
const LIB=[

  {wk:7,type:"Easy",mid:"5 x 1k @ {HMP/1k}, 90s rest",lr:"3mi WU\n3 x 3mi @ {T}, 1mi rest\n2mi CD"},
  {wk:8,type:"Hard",mid:"2 x 1mi @ {HMP}\n4 x 400 @ {5K/400}\n2 x 1mi @ {HMP}\nall 90s rest",lr:"3mi WU\n2 x 4mi @ {MP}–{HMP}, 1mi rest\n3mi CD"},
  {wk:9,type:"Medium",mid:"10 x 800 @ {10K/800}, 2min rest",lr:"4mi WU\n8mi @ {T}\n4mi CD"},
  {wk:10,type:"Easy",mid:"Easy with 6 x 1min on/off",lr:"Easy 16mi"},

  {wk:12,type:"Medium",mid:"6 x 1mi @ {HMP}, 2min rest",lr:"16mi with 2 x 4mi @ {MP}–{HMP}, 5min rest"},
  {wk:13,type:"Easy",mid:"8 x 1k @ {HMP/1k}, 90s rest",lr:"16mi with 6 x 4min @ {HMP}, 1min rest"},
  {wk:14,type:"Medium",mid:"6 x (1mi @ {HMP/1mi} + 800 @ {5K/800})\n60s rep rest, 2min set rest",lr:"20mi easy"},
  {wk:15,type:"Hard",mid:"2mi @ {T}\n3min rest\n4 x 400 @ {5K/400}, 60s rest\n3min rest\n2mi @ {T}",lr:"4mi WU\n8 x 1mi @ {MP}–{HMP}, 2min rest\n4mi CD"},
  {wk:16,type:"Easy",taper:true,mid:"4-3-2-1 min hard / equal easy float",lr:"20mi with 14mi @ {MP}\n3mi WU, 3mi CD"},
  {wk:17,type:"Medium",taper:true,mid:"8 x 1k @ {HMP/1k}, 90s rest\n2 x 4 x 200 @ {MILE/200}, 90s rep rest, 3min set rest",lr:"2mi WU\n2 x 6mi @ {MP}, 5min rest\n2mi CD"},

// Pick the workbook week of this type at the most similar point in the block; avoid reusing one already in the plan.
function pickEntry(type,phase,used){
  const pool=type==="Taper"?LIB.filter(e=>e.taper):LIB.filter(e=>e.type===type);
  let best=null,bs=Infinity;
  for(const e of pool){const sc=Math.abs((e.wk-1)/18-phase)+(used&&used.has(e.wk)?.2:0);if(sc<bs){bs=sc;best=e}}
  return best;
}
function workoutsFor(plan,wi,type,used){
  if(type==="Race")return{days:raceWeekDays(plan),src:null};
  const s=plan.settings,n=plan.weeks.length,e=pickEntry(type,n>1?wi/(n-1):1,used),d=baseDays(s,type);
  if(e){if(e.mid)d[s.qualityDay]=e.mid;d[s.longDay]=e.lr;if(used)used.add(e.wk)}
  else d[s.longDay]="Easy long run";
  return{days:d,src:e?e.wk:null};
}
const TAPER_PCT=[.85,.72,.64],RACE_PCT=.58;

function weekCount(plan){
  const a=mondayOf(toD(plan.start)),b=mondayOf(toD(plan.raceDate));
  return Math.max(1,Math.round((b-a)/DAY_MS/7)+1);
}
function blankWeek(){return{type:"Easy",miles:null,days:Array(7).fill("")}}
function baseDays(s,type){
  const d=Array(7).fill("Easy");
  if(type==="Medium")return d; // workbook Medium weeks have no strides day
  d[3]="Easy + strides";
  if(s.longDay===3||s.qualityDay===3)d[4]="Easy + strides";
  return d;
}
function raceWeekDays(plan){
  const r=dow(toD(plan.raceDate)),d=Array(7).fill("Easy");
  for(let i=0;i<7;i++){
    if(i>r)d[i]="Rest";
    else if(i===r)d[i]="RACE DAY\nGoal {GOAL} · {MP}";
    else if(i===r-1)d[i]="Shakeout 3mi + strides\nTypical pre-race";
    else if(i===r-4)d[i]="Easy + strides";
  }
  if(r>=6)d[0]="Rest";
  return d;
}
function generate(plan,{miles=true,workouts=true}={}){
  const s=plan.settings, n=weekCount(plan);
  const taperN=Math.min(3,Math.max(0,n-2)), buildN=n-1-taperN;
  const weeks=[];
  for(let i=0;i<n;i++)weeks.push(plan.weeks[i]?clone(plan.weeks[i]):blankWeek());
  // mileage: 3-week blocks (Easy, Hard, Medium) rising toward peak; taper as % of peak
  if(miles){
    const peak=+s.peakMiles||80, step=+s.step||0, start=+s.startMiles||Math.round(peak*.6);
    const nBlocks=Math.ceil(buildN/3), top=peak-2*step;
    const inc=nBlocks>1?(top-start)/(nBlocks-1):0;
    for(let i=0;i<buildN;i++){
      const j=buildN-1-i, bfe=Math.floor(j/3), within=2-(j%3);
      weeks[i].miles=Math.max(0,Math.round(top-bfe*inc+within*step));
      weeks[i].type=["Easy","Hard","Medium"][within];
    }
    for(let t=0;t<taperN;t++){const w=weeks[buildN+t];w.miles=Math.round(peak*TAPER_PCT[t]);w.type="Taper"}
    weeks[n-1].miles=Math.round(peak*RACE_PCT);weeks[n-1].type="Race";
  }
  if(workouts){
    plan.weeks=weeks;
    const used=new Set();
    weeks.forEach((w,i)=>{const r=workoutsFor(plan,i,w.type,used);w.days=r.days;w.src=r.src});
  }
  plan.weeks=weeks;
  return plan;
}
// Keep weeks aligned to race day when dates move: add/drop weeks at the start.
function resize(plan){
  const n=weekCount(plan),cur=plan.weeks.length;
  if(n>cur){
    const first=plan.weeks[0]||blankWeek(),add=[];
    for(let i=0;i<n-cur;i++){const w=blankWeek();w.miles=first.miles;w.days=baseDays(plan.settings);w.days[plan.settings.longDay]="Easy long run";add.push(w)}
    plan.weeks=add.concat(plan.weeks);
    return `Added ${n-cur} base week${n-cur>1?"s":""} at the start`;
  }
  if(n<cur){plan.weeks=plan.weeks.slice(cur-n);return `Removed ${cur-n} week${cur-n>1?"s":""} from the start`}
  return "";
}
function newPlan(o={}){
  const race=o.raceDate||iso(addDays(todayD(),7*18));
  const p={name:o.name||"New marathon block",athlete:o.athlete||"",race:o.race||"",dist:+o.dist||26.2188,
    start:o.start||iso(addDays(mondayOf(toD(race)),-7*17)),raceDate:race,goal:o.goal||"2:45:00",
    settings:Object.assign({startMiles:50,peakMiles:80,step:6,qualityDay:2,longDay:5},o.settings||{}),weeks:[],updatedAt:Date.now()};
  return generate(p);
}

function lsGetEarly(k){try{return localStorage.getItem(k)}catch(e){return null}}

function renderTop(){
  $("#topbar").innerHTML=`<div class="top-in">
    <div class="brand">Block<b>/</b>Builder</div>
    <select id="planSel" aria-label="Open a plan"></select>
    ${RO()?'<span class="badge">Read-only copy</span>':S.mode==="loading"?"":`<button class="btn${S.unsaved?" primary":""}" id="saveBtn" data-act="save"${S.unsaved?"":" disabled"} title="Save (⌘/Ctrl+S)">Save</button><button class="btn" data-act="save-as">Save as…</button><button class="btn ghost" id="discardBtn" data-act="discard"${S.unsaved?"":" hidden"}>Discard changes</button><button class="btn" data-act="new">+ New plan</button>`}
    <span class="status${S.statusErr?" err":""}" id="status">${esc(S.statusText||"Loading plans…")}</span></div>`;
  renderSelect();
}
const fmtStamp=ms=>{const d=new Date(ms);return `${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`};
function stripId(p){const o=clone(p);delete o.id;return o}

async function initStore(){
  renderTop();
  let db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){db=null}
  if(db){
    S.mode="db";S.col=db.collection("plans");
    S.col.onSnapshot(snap=>{
      const seen=new Set();let curChanged=false;
      snap.docs.forEach(doc=>{
        seen.add(doc.id);
        if(S.dirty.has(doc.id))return;
        const data=doc.data();if(!data)return;
        const have=S.plans[doc.id];
        if(!have||have.updatedAt!==data.updatedAt){S.plans[doc.id]=Object.assign(data,{id:doc.id});if(doc.id===S.cur)curChanged=true}
      });
      for(const id of Object.keys(S.plans))if(!seen.has(id)&&!S.dirty.has(id)){delete S.plans[id];if(id===S.cur)curChanged=true}
      if(S.mode==="db"&&!S.dirty.size&&!S.statusErr&&!S.unsaved)status(savedMsg());
      afterLoad(curChanged);
    },err=>status("Couldn't reach the plan library: "+(err&&err.message||"try reloading"),true));
    renderTop();
    // editors get the button that refreshes the public read-only copy
    try{const u=window.claude.use?await window.claude.use("user"):null;S.canPublish=u?await u.canEdit():true}catch(e){S.canPublish=true}
    renderTop();if(P())render();
  }else if(!STANDALONE&&SNAP&&SNAP.plans&&Object.keys(SNAP.plans).length){
    S.mode="snapshot";
    for(const id in SNAP.plans)S.plans[id]=Object.assign(clone(SNAP.plans[id]),{id});
    status("Updated "+fmtStamp(SNAP.updatedAt));
    renderTop();afterLoad(true);
  }else{
    S.mode="local";
    try{const raw=JSON.parse(lsGet(LS)||"{}");for(const id in raw)S.plans[id]=Object.assign(raw[id],{id})}catch(e){}
    // first visit to the standalone site: start from the plans bundled with the page
    if(STANDALONE&&!Object.keys(S.plans).length&&SNAP&&SNAP.plans&&lsGet("blockbuilder.seeded")===null){
      for(const id in SNAP.plans)S.plans[id]=Object.assign(clone(SNAP.plans[id]),{id});
      saveLocal();lsSet("blockbuilder.seeded","1");
    }
    status("Plans save in this browser");
    renderTop();afterLoad(true);
  }
}
async function publishSnapshot(btn){
  btn.disabled=true;btn.textContent="Updating…";
  if(S.editing)commitEditor();
  for(const id of Object.keys(S.timers))if(S.timers[id]){clearTimeout(S.timers[id]);S.timers[id]=null;await flush(id)}
  const fail=msg=>{btn.disabled=false;btn.textContent="Update public copy";const n=$("#pub-note");if(n)n.textContent=msg};
  let art=null;try{art=window.claude&&window.claude.use?await window.claude.use("artifact"):null}catch(e){}
  if(!art)return fail("Updating the public copy isn't available in this view. Open the page on claude.ai while signed in.");
  const plans={};for(const id in S.plans)plans[id]=stripId(S.plans[id]);
  try{
    await art.publish(buildPage({updatedAt:Date.now(),plans}));
    toast("Public copy updated. Reloading…");
  }catch(e){
    const c=e&&e.code;
    if(c==="conflict")return fail("The page was just updated somewhere else and is reloading. Try again once it reloads.");
    if(c==="not_writer"||c==="not_granted"){S.canPublish=false;return fail("Only people who can edit this page can update the public copy.")}
    if(c==="rate_limited")return fail("Updated too often. Wait a minute and try again.");
    fail("Couldn't update the public copy: "+(e&&e.message||"try again"));
  }
}
function publicCard(){
  if(S.mode!=="db"||!S.canPublish)return"";
  const has=SNAP&&SNAP.updatedAt,latest=Math.max(0,...Object.values(S.plans).map(p=>p.updatedAt||0));
  const state=!has?"No public copy yet.":latest>SNAP.updatedAt?`Last updated ${fmtStamp(SNAP.updatedAt)}. You've made changes since then.`:`Up to date as of ${fmtStamp(SNAP.updatedAt)}.`;
  return `<div class="card"><h2>Public read-only copy</h2>
    <p>People without a Claude account see your plans as they were when you last clicked Update. Turn on the public link from this page's Share menu. Updating saves a new version of the page and reloads it.</p>
    <p class="hint" id="pub-note" style="margin-top:-4px">${state}</p>
    <div class="btns"><button class="btn primary" data-act="publish-snap">Update public copy</button></div></div>`;
}
function saveLocal(){const o={};for(const id in S.plans)o[id]=stripId(S.plans[id]);lsSet(LS,JSON.stringify(o))}
// Edits change the working copy (S.draft). Save writes it to the library.
function touch(){
  if(RO()||!S.draft)return;
  S.unsaved=true;
  lsSet("blockbuilder.draft",JSON.stringify({id:S.cur,base:S.plans[S.cur]?S.plans[S.cur].updatedAt:null,plan:stripId(S.draft)}));
  updateSaveUI();
}
function clearDraft(){lsSet("blockbuilder.draft","")}
function updateSaveUI(){
  const b=$("#saveBtn"),d=$("#discardBtn");
  if(b){b.disabled=!S.unsaved;b.classList.toggle("primary",S.unsaved)}
  if(d)d.hidden=!S.unsaved;
  if(S.unsaved)status("Unsaved changes");
  renderSelect();
}
function savedMsg(){return S.mode==="db"?"All changes saved to the shared library":"All changes saved in this browser"}
function savePlan(){
  if(!S.draft||RO())return;
  if(S.editing)commitEditor();
  const p=clone(S.draft);p.updatedAt=Date.now();S.draft.updatedAt=p.updatedAt;
  S.plans[S.cur]=p;S.unsaved=false;clearDraft();
  S.dirty.add(S.cur);flush(S.cur);
  updateSaveUI();toast("Saved “"+p.name+"”");
}
function saveAs(name){
  if(S.editing)commitEditor();
  const p=clone(S.draft);p.id=uid();p.name=name;p.updatedAt=Date.now();
  S.unsaved=false;clearDraft();
  addPlan(p);toast("Saved as “"+name+"”");
}
function discardDraft(){S.unsaved=false;clearDraft();setCurrent(S.cur);status("Changes discarded");render()}
function setCurrent(id){
  S.cur=id&&S.plans[id]?id:null;S.unsaved=false;S.dayIdx=null;
  if(S.cur)lsSet("blockbuilder.cur",S.cur);
  S.draft=S.cur?clone(S.plans[S.cur]):null;
  if(S.cur&&!RO()){
    try{const d=JSON.parse(lsGet("blockbuilder.draft")||"null");
      if(d&&d.id===S.cur&&d.base===S.plans[S.cur].updatedAt){S.draft=Object.assign(d.plan,{id:S.cur});S.unsaved=true}}catch(e){}
  }
  renderTop();if(S.unsaved)updateSaveUI();
}
// Run next() now, or after the person saves or discards unsaved changes.
function guardUnsaved(next){
  if(!S.unsaved||RO())return next();
  S.guardNext=next;
  modal(`<h3>Unsaved changes</h3><p>“${esc(S.draft.name)}” has changes you haven't saved.</p>
    <div class="acts"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="guard-discard">Discard changes</button><button class="btn primary" data-act="guard-save">Save and continue</button></div>`);
}
async function flush(id){
  if(S.writing[id]){S.again[id]=true;return}
  const p=S.plans[id];if(!p){S.dirty.delete(id);return}
  S.writing[id]=true;
  try{
    if(S.mode==="db")await S.col.doc(id).set(stripId(p));else saveLocal();
    if(!S.unsaved)status(savedMsg());
  }catch(e){
    status(e&&e.code==="not_granted"?"View only: you can't save changes to this library":"Not saved: "+(e&&e.message||"try again"),true);
  }
  S.writing[id]=false;
  if(S.again[id]){S.again[id]=false;return flush(id)}
  if(!S.timers[id])S.dirty.delete(id);
}
async function removePlan(id){
  delete S.plans[id];if(id===S.cur){S.unsaved=false;clearDraft()}S.dirty.delete(id);clearTimeout(S.timers[id]);
  try{if(S.mode==="db")await S.col.doc(id).delete();else saveLocal();status("Plan deleted")}
  catch(e){status("Couldn't delete: "+(e&&e.message||"try again"),true)}
}
function addPlan(p){
  p.id=p.id||uid();p.updatedAt=Date.now();
  S.plans[p.id]=clone(p);S.dirty.add(p.id);flush(p.id);
  setCurrent(p.id);render();
}
function afterLoad(curChanged){
  const ids=Object.keys(S.plans);
  if(!S.cur||!S.plans[S.cur]){
    const want=lsGet("blockbuilder.cur");
    setCurrent(want&&S.plans[want]?want:ids.sort((a,b)=>(S.plans[b].updatedAt||0)-(S.plans[a].updatedAt||0))[0]||null);
    curChanged=true;
  }else if(curChanged&&!S.unsaved)S.draft=clone(S.plans[S.cur]);
  renderSelect();
  if(curChanged){if(S.editing)S.remotePending=true;else render()}
}
const P=()=>S.draft;

/* ---------- render ---------- */
function renderSelect(){
  const sel=$("#planSel");if(!sel)return;const ids=Object.keys(S.plans).sort((a,b)=>(S.plans[a].raceDate<S.plans[b].raceDate?1:-1));
  const nm=id=>id===S.cur&&S.draft?S.draft:S.plans[id];
  sel.innerHTML=ids.length?ids.map(id=>`<option value="${id}"${id===S.cur?" selected":""}>${esc(nm(id).name||"Untitled plan")} · ${esc(nm(id).raceDate||"")}${id===S.cur&&S.unsaved?" (unsaved)":""}</option>`).join(""):`<option>No plans yet</option>`;
  sel.disabled=!ids.length;
}
function stats(p,Pc){
  const ms=p.weeks.map(w=>+w.miles||0),tot=ms.reduce((a,b)=>a+b,0),peak=Math.max(0,...ms);
  const t=todayD(),r=toD(p.raceDate),days=Math.round((r-t)/DAY_MS);
  const togo=days>0?`${days}<small>days to go</small>`:days===0?`Today`:`Done<small>${fmtD(r)}</small>`;
  return `<div class="stats">
    <div class="stat"><span class="k">Race day</span><span class="v">${fmtD(r)}<small>${DAYS[dow(r)]}</small></span></div>
    <div class="stat"><span class="k">Countdown</span><span class="v">${togo}</span></div>
    <div class="stat"><span class="k">Goal pace</span><span class="v">${Pc?fmtSec(Pc.MP,1):"—"}<small>/mi</small></span></div>
    <div class="stat"><span class="k">Length</span><span class="v">${p.weeks.length}<small>weeks</small></span></div>
    <div class="stat"><span class="k">Peak week</span><span class="v">${peak||"—"}<small>mi</small></span></div>
    <div class="stat"><span class="k">Block total</span><span class="v">${tot.toLocaleString()}<small>mi</small></span></div>
  </div>`;
}
function paceTable(Pc){
  if(!Pc)return `<p class="hint">Enter a goal time like 2:45:00 to see training paces.</p>`;
  const f=(v,m)=>Array.isArray(v)?`${fmtSec(v[0]*m/1609.344,!0)}–${fmtSec(v[1]*m/1609.344,!0)}`:fmtSec(v*m/1609.344);
  const rows=ZONES.map(z=>{
    const v=Pc[z.k];
    return `<tr><td>${z.name} <span class="code">{${z.k}}</span></td><td>${Array.isArray(v)?`${fmtSec(v[0],1)}–${fmtSec(v[1],1)}`:fmtSec(v,1)}</td><td>${f(v,1000)}</td>${z.k==="E"?"<td>—</td><td>—</td>":`<td>${f(v,400)}</td><td>${f(v,800)}</td>`}</tr>`;
  }).join("");
  return `<div class="pace-scroll"><table class="paces num"><thead><tr><th>Zone · code</th><th>/mi</th><th>/km</th><th>400</th><th>800</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="hint" style="margin-top:10px">Type a code in any workout and it shows the pace for the current goal time. Add a distance for splits: <span class="code">{5K/400}</span> <span class="code">{HMP/1k}</span> <span class="code">{MP/1mi}</span>. Change the goal and every workout updates.</p>`;
}
function kind(t){
  const s=(t||"").trim().toLowerCase();
  if(!s)return"empty";
  if(/race day/.test(s))return"race";
  if(/^(rest|off)\b/.test(s))return"rest";
  if(/^easy/.test(s)&&!/\d\s*x|@|tempo|\{|progression|escalation/.test(s))return"easy";
  return"work";
}
// v: "w" week row, "m" month grid, "d" single-day view
function dayCell(p,wi,di,Pc,v="w"){
  const w=p.weeks[wi],d=addDays(mondayOf(toD(p.start)),wi*7+di),t=w.days[di]||"",k=kind(t),isToday=+d===+todayD();
  const lbl=v==="m"?`<span class="num">${d.getUTCDate()}</span>${isToday?'<span class="tdy">Today</span>':""}`
    :v==="d"?`<span>${DAYS_LONG[di]}</span>${isToday?'<span class="tdy">Today</span>':""}`
    :`<span>${DAYS[di]}</span><span class="num">${d.getUTCDate()}</span>`;
  return `<div class="day k-${k}${RO()?" ro":""}${isToday?" today":""}" data-w="${wi}" data-d="${di}" data-v="${v}"${RO()?"":(v==="d"?"":' draggable="true"')+' tabindex="0"'} aria-label="${DAYS_LONG[di]} ${fmtD(d)}: ${esc(t?plainText(t,Pc):"empty")}${RO()?"":". Press Enter to edit."}">
    <div class="dl">${lbl}</div>
    <div class="dt">${t?resolveText(t,Pc):"—"}</div></div>`;
}
const typeSelect=(wi,w)=>`<select data-wf="type" data-w="${wi}"${RO()?" disabled":""} aria-label="Week ${wi+1} type" title="Changing the type swaps in workbook workouts of that type">${TYPES.map(t=>`<option${t===w.type?" selected":""}>${t}</option>`).join("")}</select>`;
function weekHTML(p,wi,Pc,nowIdx){
  const w=p.weeks[wi],a=addDays(mondayOf(toD(p.start)),wi*7),b=addDays(a,6),togo=p.weeks.length-1-wi;
  return `<article class="week t-${esc(w.type||"Easy")}${wi===nowIdx?" now":""}" data-wk="${wi}">
    <div class="wk-head">
      <span class="wk-num num">W${wi+1}</span>
      <span class="wk-dates">${fmtD(a)} – ${fmtD(b)}</span>
      ${wi===nowIdx?'<span class="badge">This week</span>':""}
      <span class="sp"></span>
      <span class="togo">${togo===0?"Race week":togo+" to go"}</span>
      ${typeSelect(wi,w)}
      <label class="wk-miles"><input type="number" min="0" max="250" step="1" inputmode="numeric" data-wf="miles" data-w="${wi}" id="mi-${wi}"${RO()?" disabled":""} value="${w.miles??""}" placeholder="—"> mi</label>
    </div>
    <div class="days">${DAYS.map((_,di)=>dayCell(p,wi,di,Pc)).join("")}</div>
  </article>`;
}
const MONTHS_LONG=["January","February","March","April","May","June","July","August","September","October","November","December"];
function monthHTML(p,Pc){
  const start=mondayOf(toD(p.start)),end=addDays(start,p.weeks.length*7-1);
  let out="",m=new Date(Date.UTC(start.getUTCFullYear(),start.getUTCMonth(),1));
  while(m<=end){
    const y=m.getUTCFullYear(),mo=m.getUTCMonth(),last=new Date(Date.UTC(y,mo+1,0));
    let rows="";
    for(let wk=mondayOf(m<start?start:m);wk<=(last>end?end:last);wk=addDays(wk,7)){
      const wi=Math.round((wk-start)/DAY_MS/7),w=p.weeks[wi];
      let cells="";
      for(let di=0;di<7;di++){
        const d=addDays(wk,di);
        cells+=d.getUTCMonth()===mo?dayCell(p,wi,di,Pc,"m"):`<div class="day out" aria-hidden="true"><div class="dl"><span class="num">${d.getUTCDate()}</span></div></div>`;
      }
      rows+=`<div class="mrow t-${esc(w.type||"Easy")}" data-wk="${wi}">${cells}<div class="mwk"><b>W${wi+1}</b>${typeSelect(wi,w)}<span class="mi">${w.miles??"—"} mi</span></div></div>`;
    }
    out+=`<section class="month"><h3>${MONTHS_LONG[mo]} ${y}</h3><div class="mgrid"><div class="mhead">${DAYS.map(d=>`<span>${d}</span>`).join("")}<span>Week</span></div>${rows}</div></section>`;
    m=new Date(Date.UTC(y,mo+1,1));
  }
  return `<div class="months">${out}</div>`;
}
function dayIndexDefault(p){const i=Math.round((todayD()-mondayOf(toD(p.start)))/DAY_MS);return i>=0&&i<p.weeks.length*7?i:0}
function dayHTML(p,Pc){
  const total=p.weeks.length*7;
  if(S.dayIdx==null||S.dayIdx>=total)S.dayIdx=dayIndexDefault(p);
  const i=S.dayIdx,wi=Math.floor(i/7),di=i%7,w=p.weeks[wi],start=mondayOf(toD(p.start)),date=addDays(start,i);
  const toRace=Math.round((toD(p.raceDate)-date)/DAY_MS);
  const chips=DAYS.map((dn,k)=>{const t=w.days[k]||"",d=addDays(start,wi*7+k);
    return `<button class="chip k-${kind(t)}" data-act="day-go" data-i="${wi*7+k}"${k===di?' aria-current="date"':""}><span class="cd">${dn} ${d.getUTCDate()}</span><span class="ct">${esc(t?plainText(t,Pc).split("\n")[0]:"—")}</span></button>`}).join("");
  return `<div class="dnav">
      <button class="btn" data-act="day-prev"${i<=0?" disabled":""}>‹ Prev</button>
      <div class="dnav-c"><div class="dnav-date">${DAYS_LONG[di]}, ${MONTHS_LONG[date.getUTCMonth()]} ${date.getUTCDate()}</div>
        <div class="hint">Week ${wi+1} of ${p.weeks.length} · ${toRace>0?toRace+" day"+(toRace>1?"s":"")+" to race day":toRace===0?"Race day":"After race day"}</div></div>
      <button class="btn" data-act="day-next"${i>=total-1?" disabled":""}>Next ›</button></div>
    <div class="dtools"><button class="btn ghost" data-act="day-today">Today</button><input type="date" id="day-pick" aria-label="Go to date" value="${iso(date)}" min="${iso(start)}" max="${iso(addDays(start,total-1))}"></div>
    <article class="week dayview t-${esc(w.type||"Easy")}" data-wk="${wi}">
      <div class="wk-head"><span class="wk-num num">W${wi+1}</span><span class="wk-dates">${fmtD(addDays(start,wi*7))} – ${fmtD(addDays(start,wi*7+6))}</span><span class="sp"></span>${typeSelect(wi,w)}
        <label class="wk-miles"><input type="number" min="0" max="250" step="1" inputmode="numeric" data-wf="miles" data-w="${wi}" id="mi-${wi}"${RO()?" disabled":""} value="${w.miles??""}" placeholder="—"> mi</label></div>
      <div class="days">${dayCell(p,wi,di,Pc,"d")}</div>
    </article>
    <div class="strip">${chips}</div>`;
}
function calHTML(p,Pc,nowIdx){
  if(S.view==="month")return monthHTML(p,Pc);
  if(S.view==="day")return dayHTML(p,Pc);
  return `<div class="weeks" id="weeks">${p.weeks.map((_,wi)=>weekHTML(p,wi,Pc,nowIdx)).join("")}</div>`;
}
const CAL_HINT={week:"Click a day to edit. Drag one day onto another to swap them.",month:"Click a day to edit. Drag one day onto another to swap them.",day:"Click the workout to edit it. Use ← and → to move between days."};
function calHeader(){
  return `<div class="seg" role="group" aria-label="Calendar view">${["month","week","day"].map(v=>`<button type="button" data-act="view" data-view="${v}" aria-pressed="${S.view===v}">${v[0].toUpperCase()+v.slice(1)}</button>`).join("")}</div>
    <span class="hint grow">${RO()?"Read-only copy. Use Share & export to take a copy.":CAL_HINT[S.view]}</span>`;
}
function renderCal(){
  const p=P();if(!p||!$("#cal"))return;
  if(S.editing){S.editing=null;hideTray()}
  $("#cal").innerHTML=calHTML(p,paces(p),nowIndex(p));
  $("#cal-h").innerHTML=calHeader();
}
function nowIndex(p){const i=Math.floor((todayD()-mondayOf(toD(p.start)))/DAY_MS/7);return i>=0&&i<p.weeks.length?i:-1}

      <div class="field"><label for="f-raceDate">Race date</label><input type="date" id="f-raceDate" data-f="raceDate"${dis} value="${p.raceDate}"></div>

      <div class="field"><label for="g-longDay">Long run day</label><select id="g-longDay" data-g="longDay">${DAYS_LONG.map((d,i)=>`<option value="${i}"${i==s.longDay?" selected":""}>${d}</option>`).join("")}</select></div>

    <div class="card"><h2>Reuse for the next race</h2>
      <p>Copy this block with a new race date and goal. Weeks stay lined up to race day and every pace code updates to the new goal.</p>

    <div class="card"><h2>Share & export</h2>
      <p>${S.mode==="db"?"Plans save to this page's shared library. Anyone you share the page with who is signed in to Claude sees them.":(STANDALONE?"Plans are saved in this browser. Send a share link and the other person can open the plan and add it to their own list.":"Plans are saved in this browser.")} You can also copy a plan code, or get a spreadsheet file.</p>
      <div class="btns">${STANDALONE?'<button class="btn primary" data-act="share-link">Copy share link</button>':""}<button class="btn" data-act="copy-json">Copy plan code</button><button class="btn" data-act="csv">Spreadsheet (.csv)</button><button class="btn" data-act="json-file">Plan file (.json)</button></div></div>

    ${publicCard()}`}

  drawChart();

function glActions(){
  if(S.glConfirm){
    const what={miles:"mileage and week types",workouts:"all workouts",both:"all mileage and workouts"}[S.glConfirm];
    return `<span class="confirm">Replace ${what} for ${P().weeks.length} weeks? <button class="btn primary" data-act="gl-yes">Replace</button><button class="btn ghost" data-act="gl-no">Cancel</button></span>`;
  }
  return `<button class="btn" data-act="gl-miles">Rebuild mileage</button><button class="btn" data-act="gl-workouts">Rebuild workouts</button><button class="btn" data-act="gl-both">Rebuild both</button>`;
}

/* ---------- mileage chart ---------- */
const CH={pl:34,pr:8,pt:18,pb:36};
let chartMax=100;
function drawChart(){
  const svg=$("#chart"),p=P();if(!svg||!p)return;
  const W=svg.clientWidth||700,H=240,n=p.weeks.length;
  const ms=p.weeks.map(w=>+w.miles||0);
  if(!CH.dragging)chartMax=Math.max(40,Math.ceil(Math.max(...ms)*1.15/20)*20);
  const iw=W-CH.pl-CH.pr,ih=H-CH.pt-CH.pb,cw=iw/n,bw=Math.max(4,Math.min(46,cw*.72));
  const y=v=>CH.pt+ih-(v/chartMax)*ih;
  const tickStep=chartMax>120?40:20,nowIdx=nowIndex(p);
  let g="";
  for(let v=0;v<=chartMax;v+=tickStep)g+=`<line class="grid" x1="${CH.pl}" x2="${W-CH.pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${CH.pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const every=cw<22?2:1;
  p.weeks.forEach((w,i)=>{
    const cx=CH.pl+cw*i+cw/2,v=+w.miles||0,top=y(v),col=`var(--${(w.type||"Easy").toLowerCase()})`;
    const d=addDays(mondayOf(toD(p.start)),i*7);
    g+=`<g class="wk${i===nowIdx?" now":""}" data-i="${i}">
      <rect class="col" x="${CH.pl+cw*i}" y="${CH.pt}" width="${cw}" height="${ih+CH.pb}"/>
      <rect class="bar" x="${cx-bw/2}" y="${top}" width="${bw}" height="${Math.max(0,CH.pt+ih-top)}" rx="2" fill="${col}"/>
      ${v?`<rect class="handle" x="${cx-bw/2}" y="${top-1.5}" width="${bw}" height="3" rx="1.5"/>`:""}
      ${v&&cw>=20?`<text class="ml" x="${cx}" y="${top-5}" text-anchor="middle">${v}</text>`:""}
      ${i%every===0?`<text x="${cx}" y="${H-CH.pb+15}" text-anchor="middle">W${i+1}</text><text x="${cx}" y="${H-CH.pb+28}" text-anchor="middle" style="font-size:10px">${d.getUTCMonth()+1}/${d.getUTCDate()}</text>`:""}
    </g>`;
  });
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.innerHTML=g;
}
function chartPos(e){
  const svg=$("#chart"),r=svg.getBoundingClientRect(),p=P(),n=p.weeks.length;
  const W=r.width,ih=240-CH.pt-CH.pb,cw=(W-CH.pl-CH.pr)/n;
  const x=e.clientX-r.left,yy=(e.clientY-r.top)*(240/r.height);
  const i=Math.max(0,Math.min(n-1,Math.floor((x-CH.pl)/cw)));
  const v=Math.max(0,Math.min(chartMax,Math.round((CH.pt+ih-yy)/ih*chartMax)));
  const top=CH.pt+ih-((+p.weeks[i].miles||0)/chartMax)*ih;
  return{i,v,nearTop:Math.abs(yy-top)<16||yy>top};
}

function openEditor(cell){
  if(RO())return;

  ta.addEventListener("input",fit);fit();

    if(ev.key==="Escape"){ev.preventDefault();S.editing.cancel=true;ta.blur()}

    if(v!==(p.weeks[ed.wi].days[ed.di]||"")){p.weeks[ed.wi].days[ed.di]=v;touch(p)}

function act(a,btn){
  const p=P();
  switch(a){
    case"new":if(S.unsaved&&!btn.dataset.ok){guardUnsaved(()=>{btn.dataset.ok=1;act("new",btn);delete btn.dataset.ok});break}
    {
      const race=iso(addDays(todayD(),7*20)),len=18;
      planForm("New plan",{name:"",athlete:p?p.athlete:"",race:"",raceDate:race,goal:p?p.goal:"2:45:00",dist:26.2188,start:iso(addDays(mondayOf(toD(race)),-7*(len-1))),len,startHint:"Set to 18 weeks before race day. You can change it.",withMiles:true,settings:{startMiles:p?p.settings.startMiles:50,peakMiles:p?p.settings.peakMiles:80},ok:"Build plan"},
        r=>{const np=newPlan(Object.assign(r,{settings:Object.assign({},p?p.settings:{},r.settings)}));addPlan(np);window.scrollTo(0,0);toast("Plan built from the guideline")});
      break;}
    case"dup":if(S.unsaved&&!btn.dataset.ok){guardUnsaved(()=>{btn.dataset.ok=1;act("dup",btn);delete btn.dataset.ok});break}
    {
      if(!p)return;const len=p.weeks.length,race=iso(addDays(toD(p.raceDate),7*26));
      planForm("Duplicate for next race",{name:p.name.replace(/\d{4}/,m=>String(+m+1))+(/\d{4}/.test(p.name)?"":" (copy)"),athlete:p.athlete,race:p.race,raceDate:race,goal:p.goal,dist:p.dist,start:iso(addDays(mondayOf(toD(race)),-7*(len-1))),len,startHint:`Keeps the same ${len}-week length. Shorter or longer adds or removes weeks at the start.`,ok:"Create copy"},
        r=>{
          const np=Object.assign(clone(stripId(p)),r,{settings:clone(p.settings)});
          const oldRace=dow(toD(p.raceDate));
          resize(np);
          const last=np.weeks[np.weeks.length-1];
          if(dow(toD(np.raceDate))!==oldRace&&last.days.some(x=>/race day/i.test(x)))last.days=raceWeekDays(np);
          addPlan(np);window.scrollTo(0,0);toast("Copied. Paces now match the "+np.goal+" goal");
        });
      break;}
    case"publish-snap":publishSnapshot(btn);break;
    case"save":savePlan();break;
    case"discard":discardDraft();break;
    case"save-as":
      if(!p)return;
      modal(`<h3>Save as a new plan</h3><div class="field"><label for="m-sa">Plan name</label><input type="text" id="m-sa" value="${esc(p.name+" (copy)")}"></div>
        <p class="hint">Your current changes go into the new plan. “${esc((S.plans[S.cur]||p).name)}” stays as it was last saved.</p>
        <div class="acts"><button class="btn ghost" data-act="close">Cancel</button><button class="btn primary" data-act="save-as-ok">Save</button></div>`);
      {const i=$("#m-sa");i.select();i.addEventListener("keydown",e=>{if(e.key==="Enter")act("save-as-ok")})}
      break;
    case"save-as-ok":{const n=$("#m-sa").value.trim()||"Untitled plan";closeModal();saveAs(n);window.scrollTo(0,0);break;}
    case"guard-save":{const n=S.guardNext;S.guardNext=null;closeModal();savePlan();n&&n();break;}
    case"guard-discard":{const n=S.guardNext;S.guardNext=null;closeModal();S.unsaved=false;clearDraft();n&&n();break;}
    case"view":setView(btn.dataset.view);break;
    case"day-prev":if(S.dayIdx>0){S.dayIdx--;renderCal()}break;
    case"day-next":if(S.dayIdx<p.weeks.length*7-1){S.dayIdx++;renderCal()}break;
    case"day-today":S.dayIdx=dayIndexDefault(p);renderCal();if(S.dayIdx===0&&dayIndexDefault(p)===0&&nowIndex(p)<0)toast("Today isn't in this plan, so this is the first day");break;
    case"day-go":S.dayIdx=+btn.dataset.i;renderCal();break;
    case"modal-ok":S.modalSubmit&&S.modalSubmit();break;
    case"close":closeModal();break;
    case"gl-miles":case"gl-workouts":case"gl-both":S.glConfirm=a.slice(3);$("#gl-actions").innerHTML=glActions();break;
    case"gl-no":S.glConfirm=null;$("#gl-actions").innerHTML=glActions();break;
    case"gl-yes":{const m=S.glConfirm;S.glConfirm=null;generate(p,{miles:m!=="workouts",workouts:m!=="miles"});touch(p);render();toast("Rebuilt from the guideline");break;}
    case"share-link":{
      encodePlan(exportable(p)).then(code=>{
        const url=location.href.split("#")[0]+"#plan="+code;
        copyText(url,"Share link copied").then(ok=>{if(!ok){modal(`<h3>Share link</h3><p class="hint">Copy this link and send it. Opening it shows the plan and offers to add it.</p><textarea class="io" id="io-copy" readonly>${esc(url)}</textarea><div class="acts"><button class="btn primary" data-act="close">Done</button></div>`);$("#io-copy").select()}});
      });
      break;}
    case"shared-add":{const o=S.sharedPlan;S.sharedPlan=null;closeModal();if(o)guardUnsaved(()=>{addPlan(o);window.scrollTo(0,0);toast("Added "+o.name)});break;}
    case"copy-json":{
      const code=JSON.stringify(exportable(p));
      copyText(code,"Plan code copied. Paste it into Import on another library.").then(ok=>{if(!ok){modal(`<h3>Plan code</h3><p class="hint">Copy this text and send it. The other person pastes it into Import plan code.</p><textarea class="io" id="io-copy" readonly style="min-height:220px">${esc(code)}</textarea><div class="acts"><button class="btn primary" data-act="close">Done</button></div>`);$("#io-copy").select()}});
      break;}
    case"csv":offerFile(slug(p.name)+".csv",csv(p),"Spreadsheet rows copied. Paste them into Google Sheets.");break;
    case"json-file":offerFile(slug(p.name)+".json",JSON.stringify(exportable(p),null,1),"Plan file text copied");break;
    case"import":
      modal(`<h3>Import plan code</h3><p class="hint">Paste a plan code or the contents of a .json plan file.</p><textarea class="io" id="io-in" placeholder='{"name": …}'></textarea><p class="hint" id="m-err"></p><div class="acts"><button class="btn ghost" data-act="close">Cancel</button><button class="btn primary" data-act="import-ok">Import</button></div>`);
      break;
    case"import-ok":{
      let o;try{o=JSON.parse($("#io-in").value)}catch(e){$("#m-err").textContent="That isn't a plan code. Copy the whole code, including the { and } at each end.";return}
      if(!o||!Array.isArray(o.weeks)||!o.start||!o.raceDate){$("#m-err").textContent="This code is missing weeks or dates. Copy it again from Share & export.";return}
      delete o.format;delete o.id;
      o.settings=Object.assign({startMiles:50,peakMiles:80,step:6,qualityDay:2,longDay:5},o.settings||{});
      o.weeks=o.weeks.map(w=>({type:TYPES.includes(w.type)?w.type:"Easy",miles:w.miles==null||w.miles===""?null:+w.miles,days:Array.from({length:7},(_,i)=>String((w.days||[])[i]||""))}));
      o.dist=+o.dist||26.2188;o.goal=String(o.goal||"3:00:00");o.name=String(o.name||"Imported plan");
      resize(o);closeModal();guardUnsaved(()=>{addPlan(o);window.scrollTo(0,0);toast("Imported "+o.name)});break;}
    case"del":$("#del-area").innerHTML=`<span class="confirm">Delete “${esc(p.name)}” for everyone? <button class="btn danger" data-act="del-yes">Delete</button><button class="btn ghost" data-act="del-no">Keep</button></span>`;break;
    case"del-no":render();break;
    case"del-yes":{const id=S.cur;S.cur=null;S.draft=null;removePlan(id).then(()=>afterLoad(true));break;}
  }
}

/* ---------- share links (standalone site): #plan=<deflated, base64url JSON> ---------- */
const b64u=bytes=>{let s="";for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const unb64u=str=>{const s=atob(str.replace(/-/g,"+").replace(/_/g,"/"));const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b};
async function encodePlan(o){
  const raw=new TextEncoder().encode(JSON.stringify(o));
  if(window.CompressionStream){const buf=await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer();return "z"+b64u(new Uint8Array(buf))}
  return "j"+b64u(raw);
}
async function decodePlan(code){
  const bytes=unb64u(code.slice(1));
  const raw=code[0]==="z"?new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer()):bytes;
  return JSON.parse(new TextDecoder().decode(raw));
}
function cleanImported(o){
  if(!o||!Array.isArray(o.weeks)||!o.start||!o.raceDate)throw new Error("missing weeks or dates");
  delete o.format;delete o.id;
  o.settings=Object.assign({startMiles:50,peakMiles:80,step:6,qualityDay:2,longDay:5},o.settings||{});
  o.weeks=o.weeks.map(w=>({type:TYPES.includes(w.type)?w.type:"Easy",miles:w.miles==null||w.miles===""?null:+w.miles,days:Array.from({length:7},(_,i)=>String((w.days||[])[i]||""))}));
  o.dist=+o.dist||26.2188;o.goal=String(o.goal||"3:00:00");o.name=String(o.name||"Shared plan");
  resize(o);return o;
}
async function openSharedLink(){
  const m=location.hash.match(/^#plan=([zj][A-Za-z0-9_-]+)$/);if(!m)return;
  history.replaceState(null,"",location.pathname+location.search);
  try{
    const o=cleanImported(await decodePlan(m[1]));S.sharedPlan=o;
    const Pc=paces(o),miles=o.weeks.map(w=>+w.miles||0);
    modal(`<h3>Shared plan</h3><p><strong>${esc(o.name)}</strong>${o.athlete?" · "+esc(o.athlete):""}</p>
      <p class="hint">${o.weeks.length} weeks to ${esc(fmtLong(toD(o.raceDate)))} · goal ${esc(o.goal)}${Pc?" ("+fmtSec(Pc.MP,1)+"/mi)":""} · peak ${Math.max(0,...miles)} mi</p>
      <p class="hint">Add it to the plans saved in this browser to view and edit it. Your changes won't affect the sender's copy.</p>
      <div class="acts"><button class="btn ghost" data-act="close">Not now</button><button class="btn primary" data-act="shared-add">Add to my plans</button></div>`);
  }catch(e){toast("That share link is incomplete. Ask for the link again.")}
}

initStore().then(()=>{if(STANDALONE)openSharedLink()});
window.addEventListener("hashchange",()=>{if(STANDALONE)openSharedLink()});
})();
</script>
